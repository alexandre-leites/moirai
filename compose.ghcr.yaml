# OVERLAY, NOT A STACK. This file only swaps `build:` for `image:` on the four
# services; it defines no postgres, no environment, and no secrets. Deploying it
# on its own gives four containers with no configuration, which fail at startup
# with "provide database_url ...", "provide the registration token ..." and an
# API that cannot reach the orchestrator. It must be layered on compose.yaml:
#
#   docker compose -f compose.yaml -f compose.ghcr.yaml up --detach --wait
#
# For a single self-contained file that pulls the same images -- one you can
# paste into Portainer -- use compose.local.yaml instead.
#
# Run the stack from the images published to GitHub Container Registry instead
# of building them from this checkout. Everything else -- networks, secrets,
# healthchecks, capability drops -- still comes from compose.yaml.
#
#   export MOIRAI_IMAGE_TAG=1.4.0
#   docker compose -f compose.yaml -f compose.ghcr.yaml pull
#   docker compose -f compose.yaml -f compose.ghcr.yaml up --detach --wait
#
# The packages inherit the repository's visibility, so a private repository
# needs `docker login ghcr.io` with a token carrying `read:packages` first.
#
# `build: !reset null` removes the build section compose.yaml declares for the
# service. Without it, `up` would quietly build from local source whenever the
# requested tag is not already in the image store, which is exactly the outcome
# this overlay exists to prevent.
#
# MOIRAI_IMAGE_TAG defaults to `latest`, which moves. Pin it to an exact version
# (1.4.0) or to a commit (sha-abc1234) for anything you need to reproduce.

services:
  orchestrator:
    build: !reset null
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/orchestrator:${MOIRAI_IMAGE_TAG:-latest}

  api:
    build: !reset null
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/api:${MOIRAI_IMAGE_TAG:-latest}

  web:
    build: !reset null
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/web:${MOIRAI_IMAGE_TAG:-latest}

  runner:
    build: !reset null
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/runner:${MOIRAI_IMAGE_TAG:-latest}
