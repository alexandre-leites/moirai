<title>Moirai Console — UI proposal</title>
<style>

      --border-soft: #272b3c;
      --ink: #e6e4dc;
      --ink-2: #a5a2b2;
      --ink-3: #767386;
      --thread: #d4a752;
      --thread-mark: #d4a752;
      --thread-soft: #322c1d;
      --ok: #57a06b;
      --ok-soft: #1e2b23;
      --crit: #c25c7c;

      --warn: #c48229;
      --warn-soft: #322818;
      --wait: #6b8fd4;
      --wait-soft: #1f2536;
      --idle: #767386;
      --idle-soft: #262a39;
      --chart-ok: #57a06b;
      --chart-crit: #b04565;
      --chart-warn: #c48229;

    --ground: #f3f2f5;
    --surface: #fbfbfa;
    --raised: #ffffff;
    --border: #dddbe2;
    --border-soft: #e8e6ec;
    --ink: #23222b;
    --ink-2: #5c5a68;
    --ink-3: #8c8998;
    --thread: #9a7420;
    --thread-mark: #b98a2e;
    --thread-soft: #f0e6cf;
    --ok: #34965c;
    --ok-soft: #e2f0e7;
    --crit: #93294a;
    --crit-soft: #f4e2e8;
    --warn: #a8641c;
    --warn-soft: #f4e9dc;
    --wait: #4a6fb5;
    --wait-soft: #e3e9f5;
    --idle: #8c8998;
    --idle-soft: #ebeaef;
    --chart-ok: #34965c;
    --chart-crit: #93294a;
    --chart-warn: #a8641c;

  }
  :root[data-theme="dark"] {

    --surface: #1b1e2b;
    --raised: #222635;
    --border: #313548;
    --border-soft: #272b3c;
    --ink: #e6e4dc;
    --ink-2: #a5a2b2;
    --ink-3: #767386;
    --thread: #d4a752;
    --thread-mark: #d4a752;
    --thread-soft: #322c1d;
    --ok: #57a06b;
    --ok-soft: #1e2b23;
    --crit: #c25c7c;
    --crit-soft: #33202a;
    --warn: #c48229;
    --warn-soft: #322818;
    --wait: #6b8fd4;
    --wait-soft: #1f2536;
    --idle: #767386;
    --idle-soft: #262a39;

  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    background: var(--ground);
    color: var(--ink);
    font: 14px/1.55 system-ui, "Segoe UI", sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  .serif { font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif; }
  .mono { font-family: ui-monospace, "SF Mono", "Cascadia Code", Menlo, Consolas, monospace; font-variant-numeric: tabular-nums; }

  a { color: var(--wait); text-decoration: none; }
  a:hover { text-decoration: underline; }
  button { font: inherit; color: inherit; }
  :is(button, a, [tabindex]):focus-visible {
    outline: 2px solid var(--focus);
    outline-offset: 2px;
    border-radius: 4px;
  }

  .app { display: flex; min-height: 100vh; }

  /* ---------- Sidebar ---------- */
  .side {
    width: 208px; flex: none;
    border-right: 1px solid var(--border-soft);
    background: var(--surface);
    padding: 20px 12px;
    display: flex; flex-direction: column; gap: 4px;
    position: sticky; top: 0; height: 100vh;
  }
  .wordmark {
    display: flex; align-items: center; gap: 10px;
    padding: 2px 10px 18px;
  }
  .wordmark svg { flex: none; }
  .wordmark .name {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-size: 21px; letter-spacing: 0.02em;
  }
  .wordmark .sub { font-size: 10.5px; color: var(--ink-3); letter-spacing: 0.14em; text-transform: uppercase; }
  .navlab {
    font-size: 10.5px; letter-spacing: 0.14em; text-transform: uppercase;
    color: var(--ink-3); padding: 14px 10px 4px;
  }
  .nav-item {
    display: flex; align-items: center; gap: 9px;
    width: 100%; text-align: left;
    background: none; border: 0; border-radius: 7px;
    padding: 7px 10px; cursor: pointer;
    color: var(--ink-2); font-size: 13.5px;
  }
  .nav-item:hover { background: var(--idle-soft); color: var(--ink); }
  .nav-item[aria-current="page"] { background: var(--thread-soft); color: var(--ink); font-weight: 600; }
  .nav-item[aria-current="page"] .nav-dot { background: var(--thread); }
  .nav-dot { width: 6px; height: 6px; border-radius: 50%; background: var(--border); flex: none; }
  .nav-item .count {
    margin-left: auto; font-size: 11.5px; color: var(--ink-3);
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .nav-item .count.hot { color: var(--crit); font-weight: 700; }
  .side .foot { margin-top: auto; padding: 10px; font-size: 12px; color: var(--ink-3); }
  .side .foot .who { color: var(--ink-2); }

  /* ---------- Main ---------- */
  .main { flex: 1; min-width: 0; padding: 26px 32px 64px; max-width: 1240px; }
  .view-head { margin: 0 0 4px; display: flex; align-items: baseline; gap: 14px; flex-wrap: wrap; }
  .view-head h1 {
    font-family: "Iowan Old Style", "Palatino Linotype", Palatino, Georgia, serif;
    font-weight: 600; font-size: 26px; margin: 0; letter-spacing: 0.01em;

  }
  .view-head .crumb { color: var(--ink-3); font-size: 13px; }
  .view-sub { color: var(--ink-2); margin: 0 0 22px; max-width: 62ch; }

  .grid { display: grid; gap: 14px; }
  .cards-4 { grid-template-columns: repeat(4, 1fr); }
  .cols-2 { grid-template-columns: 3fr 2fr; align-items: start; }

  @media (max-width: 820px) {
    .side { display: none; }
    .main { padding: 18px 14px 48px; }
  }

  .card {
    background: var(--surface);
    border: 1px solid var(--border-soft);
    border-radius: 10px;
    box-shadow: var(--shadow);
  }
  .card .card-h {
    display: flex; align-items: baseline; gap: 10px;
    padding: 13px 16px 0;
  }
  .card .card-h h2 { font-size: 13px; margin: 0; font-weight: 650; letter-spacing: 0.01em; }
  .card .card-h .hint { font-size: 12px; color: var(--ink-3); margin-left: auto; }
  .card .card-b { padding: 12px 16px 14px; }

  /* stat tiles */
  .tile { padding: 14px 16px 12px; display: flex; flex-direction: column; gap: 2px; }
  .tile .lab { font-size: 11.5px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--ink-3); }
  .tile .val { font-size: 27px; font-weight: 650; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; line-height: 1.15; }

  .tile .note { font-size: 12px; color: var(--ink-2); }
  .tile .note.bad { color: var(--crit); font-weight: 600; }
  .tile svg { margin-top: 6px; }

  /* pills */
  .pill {
    display: inline-flex; align-items: center; gap: 6px;
    font-size: 11.5px; font-weight: 600; letter-spacing: 0.02em;
    border-radius: 999px; padding: 2.5px 9px;
    white-space: nowrap;
  }
  .pill i { width: 7px; height: 7px; border-radius: 50%; background: currentColor; flex: none; font-style: normal; }
  .p-run  { background: var(--thread-soft); color: var(--thread); }
  .p-ok   { background: var(--ok-soft); color: var(--ok); }
  .p-bad  { background: var(--crit-soft); color: var(--crit); }
  .p-warn { background: var(--warn-soft); color: var(--warn); }
  .p-wait { background: var(--wait-soft); color: var(--wait); }
  .p-idle { background: var(--idle-soft); color: var(--idle); }
  .pulse i { animation: pulse 1.6s ease-in-out infinite; }
  @keyframes pulse { 50% { opacity: 0.35; } }
  @media (prefers-reduced-motion: reduce) {
    .pulse i, .spindle-core { animation: none !important; }
  }

  /* tables */
  .tbl-wrap { overflow-x: auto; }
  table { border-collapse: collapse; width: 100%; font-size: 13px; }
  th {
    text-align: left; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--ink-3); font-weight: 600; padding: 8px 12px;
    border-bottom: 1px solid var(--border-soft); white-space: nowrap;
  }
  td { padding: 9px 12px; border-bottom: 1px solid var(--border-soft); vertical-align: middle; }
  tr:last-child td { border-bottom: 0; }
  tr.rowlink { cursor: pointer; }
  tr.rowlink:hover td { background: var(--idle-soft); }
  tr.rowlink:focus-visible { outline: 2px solid var(--focus); outline-offset: -2px; }
  td .t2 { color: var(--ink-3); font-size: 12px; }
  .num { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-variant-numeric: tabular-nums; }
  .right { text-align: right; }

  /* buttons */
  .btn {
    border: 1px solid var(--border); background: var(--raised);
    border-radius: 7px; padding: 5.5px 12px; cursor: pointer;
    font-size: 12.5px; font-weight: 600; color: var(--ink);
    white-space: nowrap;
  }
  .btn:hover { border-color: var(--ink-3); }
  .btn.primary { background: var(--thread); border-color: var(--thread); color: var(--ground); }
  .btn.primary:hover { filter: brightness(1.07); }
  .btn.danger { color: var(--crit); border-color: var(--crit); background: transparent; }
  .btn.danger:hover { background: var(--crit-soft); }
  .btn.sm { padding: 3.5px 9px; font-size: 12px; }
  .btn:disabled { opacity: 0.45; cursor: not-allowed; }
  .btnrow { display: flex; gap: 8px; flex-wrap: wrap; }

  /* attention list */
  .attn { display: flex; flex-direction: column; }
  .attn-item {
    display: flex; gap: 12px; align-items: flex-start;
    padding: 11px 16px; border-bottom: 1px solid var(--border-soft);
  }
  .attn-item:last-child { border-bottom: 0; }
  .attn-item .stripe { width: 3px; align-self: stretch; border-radius: 2px; flex: none; }
  .attn-item .tx { min-width: 0; flex: 1; }
  .attn-item .tx .t { font-weight: 600; font-size: 13.5px; }
  .attn-item .tx .d { color: var(--ink-2); font-size: 12.5px; }
  .attn-item .act { flex: none; display: flex; gap: 6px; align-items: center; padding-top: 2px; }

  /* feed */
  .feed { display: flex; flex-direction: column; }
  .feed-item { display: flex; gap: 10px; padding: 8px 16px; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; }
  .feed-item:last-child { border-bottom: 0; }
  .feed-item .tm { color: var(--ink-3); flex: none; width: 52px; font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px; padding-top: 1px; }
  .feed-item .ic { flex: none; width: 8px; height: 8px; border-radius: 50%; margin-top: 5px; }
  .feed-item .tx { color: var(--ink-2); }
  .feed-item .tx b { color: var(--ink); font-weight: 600; }

  /* health strip */
  .health-strip {
    display: flex; gap: 18px; flex-wrap: wrap;
    padding: 10px 16px; align-items: center;
  }
  .hp { display: flex; align-items: center; gap: 7px; font-size: 12.5px; color: var(--ink-2); }
  .hp i { width: 8px; height: 8px; border-radius: 50%; font-style: normal; flex: none; }
  .hp .v { font-family: ui-monospace, "SF Mono", Menlo, monospace; color: var(--ink); font-size: 12px; }

  /* thread (signature) */
  .threadline { width: 100%; }
  .phase-legend { display: flex; gap: 16px; flex-wrap: wrap; font-size: 12px; color: var(--ink-2); padding-top: 8px; }
  .phase-legend .k { display: inline-flex; align-items: center; gap: 6px; }
  .phase-legend .sw { width: 16px; height: 3px; border-radius: 2px; }

  .minithread { display: block; }

  /* meters */
  .meter { display: inline-flex; align-items: center; gap: 7px; }
  .meter .bar { width: 54px; height: 5px; border-radius: 3px; background: var(--idle-soft); overflow: hidden; }
  .meter .bar span { display: block; height: 100%; border-radius: 3px; background: var(--thread); }
  .meter .bar span.full { background: var(--crit); }
  .meter .n { font-size: 11.5px; color: var(--ink-3); font-family: ui-monospace, Menlo, monospace; }

  /* filter row */
  .filters { display: flex; gap: 8px; flex-wrap: wrap; margin: 0 0 14px; align-items: center; }
  .chip {
    border: 1px solid var(--border); background: var(--surface);
    border-radius: 999px; padding: 4px 12px; font-size: 12.5px; cursor: pointer; color: var(--ink-2);
  }
  .chip[aria-pressed="true"] { background: var(--thread-soft); border-color: var(--thread); color: var(--ink); font-weight: 600; }
  .filters .gap { flex: 1; }
  .search {
    border: 1px solid var(--border); background: var(--surface); color: var(--ink);
    border-radius: 7px; padding: 5px 11px; font: inherit; font-size: 13px; width: 200px;
  }
  .search:focus-visible { outline: 2px solid var(--focus); outline-offset: 1px; }

  /* detail layout */
  .detail-grid { display: grid; grid-template-columns: 1fr 320px; gap: 14px; align-items: start; }
  @media (max-width: 1000px) { .detail-grid { grid-template-columns: 1fr; } }
  .kv { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; font-size: 13px; padding: 4px 0; }
  .kv dt { color: var(--ink-3); }
  .kv dd { margin: 0; }
  .budget-row { display: flex; justify-content: space-between; align-items: center; padding: 6px 0; border-bottom: 1px solid var(--border-soft); font-size: 13px; }
  .budget-row:last-child { border-bottom: 0; }

  /* event log */
  .evt { display: flex; gap: 10px; padding: 7px 16px; border-bottom: 1px solid var(--border-soft); font-size: 12.5px; }
  .evt:last-child { border-bottom: 0; }
  .evt .tm { color: var(--ink-3); flex: none; width: 60px; font-family: ui-monospace, Menlo, monospace; font-size: 11.5px; }
  .evt .ph { flex: none; width: 86px; color: var(--ink-3); font-size: 11.5px; text-transform: uppercase; letter-spacing: 0.05em; padding-top: 1px; }
  .evt .tx { color: var(--ink-2); min-width: 0; }
  .evt .tx b { color: var(--ink); font-weight: 600; }
  .evt.warn .tx { color: var(--warn); }
  .logline {
    font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: 11.5px;
    background: var(--ground); border: 1px solid var(--border-soft); border-radius: 7px;
    padding: 10px 12px; overflow-x: auto; color: var(--ink-2); white-space: pre; line-height: 1.7;
  }

  /* decision panel */
  .decision {
    border: 1px solid var(--wait); background: var(--wait-soft);
    border-radius: 10px; padding: 14px 16px;
  }
  .decision h3 { margin: 0 0 4px; font-size: 14px; }
  .decision p { margin: 0 0 10px; font-size: 13px; color: var(--ink-2); }
  .decision textarea {
    width: 100%; min-height: 56px; resize: vertical;
    border: 1px solid var(--border); border-radius: 7px; background: var(--surface);
    color: var(--ink); font: inherit; font-size: 13px; padding: 8px 10px; margin-bottom: 10px;
  }

  /* circuit banner */
  .banner {
    display: flex; gap: 12px; align-items: center;
    border: 1px solid var(--crit); background: var(--crit-soft);
    border-radius: 10px; padding: 11px 16px; margin-bottom: 16px; font-size: 13px;
  }
  .banner .tx b { color: var(--crit); }
  .banner .act { margin-left: auto; flex: none; }

  /* toast */
  #toast {
    position: fixed; bottom: 22px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--ground);
    border-radius: 8px; padding: 9px 18px; font-size: 13px; font-weight: 600;
    opacity: 0; pointer-events: none; transition: opacity 0.25s;
    z-index: 50; box-shadow: 0 4px 18px rgba(0,0,0,0.3);
  }
  #toast.show { opacity: 1; }

  /* chart */
  .chart-tip {
    position: fixed; z-index: 40; pointer-events: none;
    background: var(--raised); border: 1px solid var(--border);
    border-radius: 8px; padding: 8px 11px; font-size: 12px;
    box-shadow: 0 4px 14px rgba(0,0,0,0.18); display: none; min-width: 130px;
  }
  .chart-tip .d { font-weight: 700; margin-bottom: 4px; }
  .chart-tip .r { display: flex; align-items: center; gap: 6px; color: var(--ink-2); }
  .chart-tip .r .sw { width: 8px; height: 8px; border-radius: 2px; flex: none; }
  .chart-tip .r .v { margin-left: auto; font-family: ui-monospace, Menlo, monospace; color: var(--ink); }
  .legend { display: flex; gap: 14px; font-size: 12px; color: var(--ink-2); padding: 8px 0 0; flex-wrap: wrap; }
  .legend .k { display: inline-flex; align-items: center; gap: 6px; }
  .legend .sw { width: 9px; height: 9px; border-radius: 2px; }

  .empty { padding: 26px 16px; text-align: center; color: var(--ink-3); font-size: 13px; }
  .section-gap { margin-top: 16px; }
  .proposal-note {
    margin-top: 40px; padding: 14px 18px; border-radius: 10px;
    border: 1px dashed var(--border); color: var(--ink-3); font-size: 12.5px; max-width: 72ch;
  }
</style>

<script>
"use strict";

/* ---------------- sample data (mirrors the real schema) ---------------- */

const PHASES = ["prepare","plan","implement","pipeline","review","push","pr","checks","human","merge","done"];
const PHASE_LABEL = { prepare:"Prepare", plan:"Plan", implement:"Implement", pipeline:"Pipeline", review:"AI review", push:"Push", pr:"Open PR", checks:"GitHub checks", human:"Human gate", merge:"Merge", done:"Complete" };

const STATUS_META = {
  planning:          { label:"Planning",        cls:"p-run pulse",  phase:"plan" },
  implementing:      { label:"Implementing",    cls:"p-run pulse",  phase:"implement" },
  local_pipeline:    { label:"Pipeline",        cls:"p-run pulse",  phase:"pipeline" },
  repairing:         { label:"Repairing",       cls:"p-warn pulse", phase:"pipeline" },
  ai_review:         { label:"AI review",       cls:"p-run pulse",  phase:"review" },
  pushing:           { label:"Pushing",         cls:"p-run pulse",  phase:"push" },
  pr_created:        { label:"PR open",         cls:"p-wait",       phase:"pr" },
  waiting_github_checks: { label:"Waiting on checks", cls:"p-wait", phase:"checks" },
  waiting_human:     { label:"Needs decision",  cls:"p-wait",       phase:"human" },
  merging:           { label:"Merging",         cls:"p-run pulse",  phase:"merge" },
  recovering:        { label:"Recovering",      cls:"p-warn pulse", phase:"implement" },
  completed:         { label:"Delivered",       cls:"p-ok",         phase:"done" },
  blocked:           { label:"Blocked",         cls:"p-bad",        phase:null },
  failed:            { label:"Failed",          cls:"p-bad",        phase:null },
  cancelled:         { label:"Cancelled",       cls:"p-idle",       phase:null },
  offered:           { label:"Offered",         cls:"p-idle",       phase:"prepare" },
  preparing:         { label:"Preparing",       cls:"p-run pulse",  phase:"prepare" },
};
const TERMINAL = new Set(["completed","blocked","failed","cancelled"]);

function meterHtml(used, budget) {

}

/* signature: the phase thread ------------------------------------------ */
function threadSvg(wf, opts={}) {
  const W = opts.w || 720, H = opts.h || 74, mini = !!opts.mini;
  const m = STATUS_META[wf.status];
  const isTerminalBad = wf.status==="blocked" || wf.status==="failed" || wf.status==="cancelled";
  // current index along the happy path
  let cur = m && m.phase ? PHASES.indexOf(m.phase) : null;
  if (wf.status==="completed") cur = PHASES.length - 1;
  // where the thread got cut (last reached phase) for terminal-bad
  let cutAt = null;
  if (isTerminalBad) {
    cutAt = wf.gates.pipeline_passed===false ? PHASES.indexOf("pipeline")
          : wf.pr ? PHASES.indexOf("checks") : PHASES.indexOf("implement");
  }
  const x0 = mini ? 2 : 16, x1 = W - (mini ? 2 : 16);
  const step = (x1-x0)/(PHASES.length-1);
  const y = mini ? H/2 : 34;
  const xs = PHASES.map((_,i)=> x0 + step*i);
  const reach = isTerminalBad ? cutAt : (cur ?? 0);

  let p = `<svg class="${mini?'minithread':'threadline'}" viewBox="0 0 ${W} ${H}" width="${mini?W:'100%'}" height="${mini?H:'auto'}" role="img" aria-label="Workflow phase progress: ${esc(m?m.label:wf.status)}">`;

  // spun (done) thread: slight weave wobble makes it a thread, not a progress bar
  const wobble = mini ? 1.2 : 2.2;
  const seg = (xa, xb, i) =>
    `M ${xa} ${y} C ${xa+step*0.35} ${y-wobble*((i%2)?1:-1)}, ${xb-step*0.35} ${y+wobble*((i%2)?1:-1)}, ${xb} ${y}`;
  let done = "", todo = "";
  for (let i=0;i<PHASES.length-1;i++) {
    const isDone = i < reach;
    const isCutGap = isTerminalBad && i === reach; // gap after the cut
    if (isDone) done += seg(xs[i], xs[i+1], i) + " ";
    else if (!isCutGap) todo += `M ${xs[i]} ${y} L ${xs[i+1]} ${y} `;
  }
  p += `<path d="${todo}" fill="none" stroke="var(--border)" stroke-width="${mini?1.5:2}" stroke-dasharray="2 5" stroke-linecap="round"/>`;
  p += `<path d="${done}" fill="none" stroke="var(--thread-mark)" stroke-width="${mini?2:2.5}" stroke-linecap="round"/>`;

  // cut: frayed end
  if (isTerminalBad && cutAt!=null) {
    const cx = xs[cutAt];
    p += `<path d="M ${cx} ${y} l ${step*0.22} ${-4} M ${cx} ${y} l ${step*0.26} ${1.5} M ${cx} ${y} l ${step*0.18} ${5}" stroke="var(--crit)" stroke-width="${mini?1.5:2}" fill="none" stroke-linecap="round"/>`;
  }

  // nodes
  PHASES.forEach((ph,i)=>{
    const x = xs[i];
    const donePh = i < reach || wf.status==="completed";
    const isCur = !isTerminalBad && cur===i && !TERMINAL.has(wf.status);
    if (mini) {
      if (isCur) p += `<circle cx="${x}" cy="${y}" r="3" fill="var(--thread-mark)"/>`;
      return;
    }
    if (isCur) {
      p += `<circle cx="${x}" cy="${y}" r="8" fill="none" stroke="var(--thread-mark)" stroke-width="1.5" opacity="0.5"/>
            <circle class="spindle-core" cx="${x}" cy="${y}" r="4.5" fill="var(--thread-mark)"/>`;
    } else if (isTerminalBad && i===cutAt) {
      p += `<circle cx="${x}" cy="${y}" r="4.5" fill="var(--crit)"/>`;
    } else if (donePh) {
      p += `<circle cx="${x}" cy="${y}" r="3.5" fill="var(--thread-mark)"/>`;
    } else {
      p += `<circle cx="${x}" cy="${y}" r="3" fill="var(--ground)" stroke="var(--border)" stroke-width="1.5"/>`;
    }
    const lab = PHASE_LABEL[ph];
    const anchor = i===0 ? "start" : (i===PHASES.length-1 ? "end" : "middle");
    const emph = isCur || (isTerminalBad && i===cutAt);
    p += `<text x="${x}" y="${y+24}" text-anchor="${anchor}" font-size="10.5" fill="${emph ? (isTerminalBad?'var(--crit)':'var(--thread)') : 'var(--ink-3)'}" font-weight="${emph?700:400}" font-family="system-ui,sans-serif">${lab}</text>`;
  });
  p += `</svg>`;
  return p;
}

/* sparkline for stat tile */
function sparkSvg(data, w=150, h=30) {
  const max = Math.max(...data), min = Math.min(...data);
  const sx = i => 2 + i*(w-8)/(data.length-1);
  const sy = v => h-4 - (v-min)/((max-min)||1)*(h-10);
  const pts = data.map((v,i)=>`${sx(i)},${sy(v)}`).join(" L ");
  const lastX = sx(data.length-1), lastY = sy(data[data.length-1]);
  return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}" aria-hidden="true">
    <path d="M ${pts} L ${lastX} ${h-2} L 2 ${h-2} Z" fill="var(--thread-soft)" opacity="0.8"/>
    <path d="M ${pts}" fill="none" stroke="var(--thread-mark)" stroke-width="1.8" stroke-linejoin="round"/>
    <circle cx="${lastX}" cy="${lastY}" r="3" fill="var(--thread-mark)"/>
  </svg>`;
}

/* stacked outcome bars: thin marks, 2px gaps, rounded top end */
function outcomesChart() {
  const W = 660, H = 170, padL = 26, padB = 22, padT = 8;
  const days = outcomes14d;
  const maxT = Math.max(...days.map(d=>d.ok+d.blocked+d.failed));
  const yMax = Math.ceil(maxT/2)*2 || 4;
  const plotW = W-padL-8, plotH = H-padT-padB;
  const bw = 18, slot = plotW/days.length;
  const y = v => padT + plotH - (v/yMax)*plotH;
  const series = [
    { k:"ok",      name:"Delivered", c:"var(--chart-ok)" },
    { k:"failed",  name:"Failed",    c:"var(--chart-crit)" },
    { k:"blocked", name:"Blocked",   c:"var(--chart-warn)" },
  ];
  let s = `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="Workflow outcomes per day, last 14 days" id="outcomes-svg">`;
  for (let g=0; g<=yMax; g+=2) {
    s += `<line x1="${padL}" y1="${y(g)}" x2="${W-8}" y2="${y(g)}" stroke="var(--border-soft)" stroke-width="1"/>
          <text x="${padL-7}" y="${y(g)+3.5}" text-anchor="end" font-size="10" fill="var(--ink-3)" font-family="ui-monospace,Menlo,monospace">${g}</text>`;
  }
  days.forEach((d,i)=>{
    const cx = padL + slot*i + slot/2;
    let acc = 0, segs = [];
    series.forEach(sr => { const v = d[sr.k]; if (v>0) { segs.push({...sr, v, from:acc, to:acc+v}); acc += v; } });
    segs.forEach((sg, si) => {
      const yTop = y(sg.to), yBot = y(sg.from);
      const gap = si < segs.length-1 ? 1 : 0; // 2px visual gap via surface stroke below
      const hgt = Math.max(2, yBot - yTop - (si>0 ? 2 : 0));
      const isTop = si === segs.length-1;
      const r = isTop ? 3 : 0;
      const yy = yTop + (si>0 ? 2 : 0) - (si>0?2:0);
      s += `<path d="M ${cx-bw/2} ${yBot} L ${cx-bw/2} ${yTop+r} Q ${cx-bw/2} ${yTop} ${cx-bw/2+r} ${yTop} L ${cx+bw/2-r} ${yTop} Q ${cx+bw/2} ${yTop} ${cx+bw/2} ${yTop+r} L ${cx+bw/2} ${yBot} Z" fill="${sg.c}" ${si>0?'stroke="var(--surface)" stroke-width="2"':''}/>`;
    });
    if (i%2===1 || days.length<=8) s += `<text x="${cx}" y="${H-6}" text-anchor="middle" font-size="9.5" fill="var(--ink-3)" font-family="system-ui,sans-serif">${d.d.replace("Jul ","")}</text>`;
    s += `<rect class="hitcol" data-i="${i}" x="${padL + slot*i}" y="${padT}" width="${slot}" height="${plotH+padB}" fill="transparent"/>`;
  });
  s += `<text x="${padL}" y="${H-6}" font-size="9.5" fill="var(--ink-3)" font-family="system-ui,sans-serif">Jul</text>`;
  s += `</svg>`;
  s += `<div class="legend">${series.map(sr=>`<span class="k"><span class="sw" style="background:${sr.c}"></span>${sr.name}</span>`).join("")}</div>`;
  return s;
}

function wireOutcomesTip() {
  const svg = $("#outcomes-svg"); if (!svg) return;
  const tip = $("#chart-tip");
  svg.addEventListener("pointermove", e => {
    const col = e.target.closest(".hitcol"); if (!col) { tip.style.display="none"; return; }
    const d = outcomes14d[+col.dataset.i];
    tip.innerHTML = `<div class="d">${esc(d.d)}</div>
      <div class="r"><span class="sw" style="background:var(--chart-ok)"></span>Delivered<span class="v">${d.ok}</span></div>
      <div class="r"><span class="sw" style="background:var(--chart-crit)"></span>Failed<span class="v">${d.failed}</span></div>
      <div class="r"><span class="sw" style="background:var(--chart-warn)"></span>Blocked<span class="v">${d.blocked}</span></div>`;
    tip.style.display = "block";
    tip.style.left = Math.min(window.innerWidth-160, e.clientX+14) + "px";
    tip.style.top = (e.clientY+14) + "px";
  });
  svg.addEventListener("pointerleave", () => { tip.style.display = "none"; });
}

    d:`${p.circuitInfo.failures} consecutive blocked workflows — ${p.circuitInfo.reason}. ${p.circuitInfo.cooldown}.`,
    act:`<button class="btn sm" data-act="reset-circuit" data-p="${p.id}">Reset circuit</button>`,
  }));
  workflows.filter(w=>w.status==="failed").forEach(w=>items.push({
    kind:"failed", color:"var(--warn)",
    t:`${projName(w.project)} #${w.issue} failed with an open PR`,
    d:w.terminal_reason,
    act:`<button class="btn sm" data-act="retry" data-w="${w.id}">Retry workflow</button> <button class="btn sm" data-go="wf:${w.id}">Inspect</button>`,
  }));
  return items;
};

function gateRow(name, v, pendingLabel) {
  const state = v===true ? ["✓ passed","var(--ok)"] : v===false ? ["✗ failed","var(--crit)"]
    : v==="pending" ? [pendingLabel||"in progress","var(--wait)"] : ["not reached","var(--ink-3)"];
  return `<div class="budget-row"><span>${name}</span><span style="color:${state[1]};font-weight:600">${state[0]}</span></div>`;
}

/* ---------------- router / wiring ---------------- */

const NAV = [
  { key:"overview",  label:"Overview" },
  { key:"queue",     label:"Queue",     count:()=>queue.length },
  { key:"workflows", label:"Workflows", count:()=>workflows.filter(w=>!TERMINAL.has(w.status)).length,
    hot:()=>workflows.some(w=>w.status==="waiting_human"||w.status==="blocked") },
  { key:"runners",   label:"Runners",   count:()=>`${runners.filter(r=>r.status==="online").length}/${runners.length}` },
  { key:"projects",  label:"Projects" },
  { key:"system",    label:"System",    hot:()=>projects.some(p=>p.circuit==="open") },
];
let route = "overview";

function renderNav() {
  $("#nav").innerHTML = `<div class="navlab">Operate</div>` + NAV.map(n=>`
    <button class="nav-item" data-go="${n.key}" ${route===n.key || (route.startsWith("wf:")&&n.key==="workflows") ? 'aria-current="page"':''}>
      <span class="nav-dot"></span>${n.label}
      ${n.count!==undefined?`<span class="count ${n.hot&&n.hot()?'hot':''}">${typeof n.count==="function"?n.count():n.count}</span>`
        : n.hot&&n.hot() ? `<span class="count hot">!</span>` : ""}
    </button>`).join("");
}

function render() {
  renderNav();
  const main = $("#main");
  if (route==="overview") main.innerHTML = viewOverview();
  else if (route==="queue") main.innerHTML = viewQueue();
  else if (route==="workflows") main.innerHTML = viewWorkflows();
  else if (route==="runners") main.innerHTML = viewRunners();
  else if (route==="projects") main.innerHTML = viewProjects();
  else if (route==="system") main.innerHTML = viewSystem();
  else if (route.startsWith("wf:")) main.innerHTML = viewWorkflowDetail(route.slice(3));
  if (route==="overview") wireOutcomesTip();
  main.insertAdjacentHTML("beforeend",
    `<div class="proposal-note"><b>Design proposal.</b> This is a static mockup with sample data — every field shown maps to an existing column in the orchestrator's Postgres schema or to a control the platform review calls for (circuit reset, runner drain, retry, workflow events). Actions show a toast instead of calling the API.</div>`);
  window.scrollTo(0,0);
}

const ACT_MSG = {
  "approve":       "Approved — merging PR and closing the issue",
  "changes":       "Changes requested — task packet updated, developer re-engaged",
  "retry":         "Workflow requeued with prior-failure context",
  "cancel":        "Workflow cancelled — issue label reset to agent:ready",
  "block":         "Workflow blocked — issue held with agent:blocked",
  "drain":         "Draining — finishes current work, then accepts no offers",
  "undrain":       "Drain cancelled — runner accepting offers again",
  "disable":       "Runner disabled — no new offers",
  "revoke":        "Runner revoked — credential invalidated",
  "reset-circuit": "Circuit closed — project schedulable again",
  "new-token":     "Token created — copy it now, it is shown only once",
  "revoke-token":  "Token revoked",
  "new-project":   "Would open the project form (name, source, branch, labels, merge policy)",
  "edit-project":  "Would open project configuration",
  "toggle-project":"Scheduling toggled for this project",
};

document.addEventListener("click", e => {
  const go = e.target.closest("[data-go]");
  if (go) { e.preventDefault(); route = go.dataset.go; render(); return; }
  const f = e.target.closest("[data-wf-filter]");
  if (f) { wfFilter = f.dataset.wfFilter; render(); return; }
  const act = e.target.closest("[data-act]");
  if (act) { toast(ACT_MSG[act.dataset.act] || "Done"); }
});
document.addEventListener("keydown", e => {
  if (e.key==="Enter") {
    const row = e.target.closest("tr[data-go]");
    if (row) { route = row.dataset.go; render(); }
  }
});

render();
</script>
