openapi: 3.1.0
info:
  title: Moirai Public API
  version: 0.1.0
  description: |
    HTTP gateway for the Moirai control plane. The API uses the `loop_session`
    cookie created by the login endpoint. Mutating authenticated requests also
    require the `X-CSRF-Token` header to equal the `loop_csrf` cookie value.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/scheduler/metrics:
    get:
      summary: Get scheduler summary metrics
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Scheduler metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: API process is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: The orchestrator connection is reachable
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/health:
    get:
      summary: API and orchestrator health
      responses:
        '200':
          description: Both services are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The API is running but the orchestrator is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/auth/login:
    post:
      summary: Create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookies were set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Login rate limit exceeded
  /api/v1/auth/logout:
    post:
      summary: Clear the browser session
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Session cookies cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/me:
    get:
      summary: Get the authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/account:
    put:
      summary: Update the authenticated user's account
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/projects:
    get:
      summary: List projects
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a project
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectConfiguration'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/projects/{project_id}:
    put:
      summary: Replace a project configuration
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectConfiguration'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/projects/{project_id}/enable:
    post:
      summary: Enable scheduling for a project
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Enabled project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{project_id}/disable:
    post:
      summary: Disable scheduling for a project
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Disabled project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{project_id}/credentials:
    get:
      summary: Report which credentials a project has configured
      description: |
        Returns presence and timestamps only. A stored credential value is
        never returned by this API — replacing it is the only way to change it.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Configured credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCredentialList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{project_id}/credentials/{kind}:
    put:
      summary: Store or replace one project credential
      description: |
        The value is encrypted at rest with the deployment's `LOOP_SECRET_KEY`.
        Requests are rejected with 422 when no key is configured, because a
        credential written without one could not be read back.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/CredentialKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCredentialValue'
      responses:
        '200':
          description: Configured credentials after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCredentialList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Remove one project credential
      description: |
        The project falls back to the deployment-wide credential. Removing a
        credential that is not configured succeeds.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/CredentialKind'
      responses:
        '200':
          description: Configured credentials after the removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCredentialList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/runner-tokens:
    get:
      summary: List runner registration tokens
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Registration tokens
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunnerToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a runner registration token
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowedLabels]
              properties:
                allowedLabels:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Registration token; retain the token value because it is not returned by list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRunnerToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/runner-tokens/{token_id}:
    delete:
      summary: Revoke a runner registration token
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TokenID'
      responses:
        '204':
          description: Token revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/runners:
    get:
      summary: List registered runners
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Runners
          content:
            application/json:
              schema:
                type: object
                required: [runners]
                properties:
                  runners:
                    type: array
                    items:
                      $ref: '#/components/schemas/Runner'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/runners/{runner_id}/drain:
    post:
      summary: Drain a runner after its active job
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RunnerID'
      responses:
        '200': { description: Draining runner, content: { application/json: { schema: { $ref: '#/components/schemas/Runner' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runners/{runner_id}/undrain:
    post:
      summary: Resume a drained runner
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RunnerID'
      responses:
        '200': { description: Available runner, content: { application/json: { schema: { $ref: '#/components/schemas/Runner' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runners/{runner_id}/revoke:
    post:
      summary: Revoke a runner credential
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RunnerID'
      responses:
        '200': { description: Revoked runner, content: { application/json: { schema: { $ref: '#/components/schemas/Runner' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/sync/status:
    get:
      summary: Per-project issue synchronization status
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sync status for every project
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueSyncStatusEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sync:
    post:
      summary: Run an issue-synchronization pass now
      description: |
        Empty body syncs every enabled project; a body with `projectId` syncs
        only that project and clears any in-memory backoff it was under.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
      responses:
        '200':
          description: Per-project sync results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '504':
          $ref: '#/components/responses/OrchestratorTimeout'
  /api/v1/workflows:
    get:
      summary: List workflows
      description: |
        Every row carries the same fields as `GET /api/v1/workflows/{workflow_id}`.
        The console renders issue titles, pull requests and attempt budgets in the
        list, the overview and the phase threads; a summary shape would cost one
        detail request per workflow.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Workflows
          content:
            application/json:
              schema:
                type: object
                required: [workflows]
                properties:
                  workflows:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workflows/{workflow_id}:
    get:
      summary: Get workflow details
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      responses:
        '200': { description: Workflow details, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workflows/{workflow_id}/events:
    get:
      summary: List workflow events newest first
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200': { description: Workflow events, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowEventsPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workflows/{workflow_id}/decision:
    post:
      summary: Submit a required human decision
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, changes_requested]
                comment:
                  type: string
      responses:
        '200':
          description: Workflow after the decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/workflows/{workflow_id}/retry:
    post:
      summary: Retry a terminal workflow
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowControlRequest' }
      responses:
        '200': { description: Workflow resumed, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/workflows/{workflow_id}/cancel:
    post:
      summary: Cancel an in-flight workflow
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowControlRequest' }
      responses:
        '200': { description: Workflow cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/workflows/{workflow_id}/block:
    post:
      summary: Block an in-flight workflow
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowControlRequest' }
      responses:
        '200': { description: Workflow blocked, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: loop_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    TokenID:
      name: token_id
      in: path
      required: true
      schema: { type: string }
    RunnerID:
      name: runner_id
      in: path
      required: true
      schema: { type: string }
    WorkflowID:
      name: workflow_id
      in: path
      required: true
      schema: { type: string }
    CredentialKind:
      name: kind
      in: path
      required: true
      schema:
        type: string
        enum: [github_token, ssh_private_key]
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication is required or invalid
    Forbidden:
      description: A CSRF token is required for this mutation
    NotFound:
      description: Requested resource was not found
    ValidationError:
      description: The control plane rejected valid JSON input
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: A dependent service is unavailable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    User:
      type: object
      required: [userId, username, role]
      properties:
        userId: { type: string }
        username: { type: string }
        role: { type: string }
        email: { type: string }
        displayName: { type: string }
    AccountUpdate:
      type: object
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
        newEmail: { type: string }
        displayName: { type: string }
    ProjectConfiguration:
      type: object
      properties:
        name: { type: string }
        repositoryMode: { type: string }
        repositoryUrl: { type: string }
        localRepositoryPath: { type: string }
        defaultBranch: { type: string }
        requiredRunnerLabels:
          type: array
          items: { type: string }
        pipelineSteps:
          type: array
          items: { $ref: '#/components/schemas/PipelineStep' }
    PipelineStep:
      type: object
      required: [command, timeoutSeconds, position, required]
      properties:
        command: { type: string, minLength: 1 }
        timeoutSeconds: { type: integer, minimum: 1, maximum: 3600 }
        position: { type: integer, minimum: 0 }
        required: { type: boolean }
    Project:
      type: object
      required: [id, name, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        repositoryMode: { type: string }
        repositoryUrl:
          type: string
          description: >-
            Clone source for managed_clone projects. Userinfo (embedded
            credentials) is never returned; any present userinfo is replaced
            with a redacted placeholder.
        localRepositoryPath: { type: string }
        defaultBranch: { type: string }
        requiredRunnerLabels:
          type: array
          items: { type: string }
        pipelineSteps:
          type: array
          items: { $ref: '#/components/schemas/PipelineStep' }
    ProjectCredentialList:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items: { $ref: '#/components/schemas/ProjectCredential' }
    ProjectCredential:
      type: object
      required: [kind, createdAt, updatedAt]
      description: >-
        A credential this project has configured. The value is deliberately
        absent: it is write-only through every layer of the system.
      properties:
        kind:
          type: string
          enum: [github_token, ssh_private_key]
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ProjectCredentialValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          format: password
          description: >-
            The credential itself — a token, or PEM private-key material. Must
            not be blank; use DELETE to remove a credential.
    RunnerToken:
      type: object
      required: [id, allowedLabels, expiresAt]
      properties:
        id: { type: string }
        allowedLabels:
          type: array
          items: { type: string }
        expiresAt: { type: string }
        usedAt: { type: string }
        revokedAt: { type: string }
    CreatedRunnerToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string }
    Runner:
      type: object
      required: [id, name, enabled, draining, status, labels, lastSeenAt]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        draining: { type: boolean }
        status: { type: string }
        labels:
          type: array
          items: { type: string }
        lastSeenAt: { type: string }
    SyncResult:
      type: object
      required: [projectId, syncedIssues]
      properties:
        projectId: { type: string }
        syncedIssues: { type: integer }
        error: { type: string }
    IssueSyncStatusEntry:
      type: object
      required: [projectId, projectName, enabled, issueCount, eligibleCount, consecutiveFailures, backingOff]
      properties:
        projectId: { type: string }
        projectName: { type: string }
        enabled: { type: boolean }
        issueCount: { type: integer }
        eligibleCount: { type: integer }
        lastSyncedAt: { type: string }
        consecutiveFailures: { type: integer }
        nextRetryAt: { type: string }
        lastError: { type: string }
        backingOff: { type: boolean }
    WorkflowControlRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1024 }
    Workflow:
      type: object
      required: [id, projectId, status, phase]
      properties:
        id: { type: string }
        projectId: { type: string }
        status: { type: string }
        phase: { type: string }
    WorkflowDetail:
      allOf:
        - $ref: '#/components/schemas/Workflow'
        - type: object
          required: [issueExternalId, issueTitle, branchName, planningAttempts, implementationAttempts, pipelineRepairAttempts, ciRepairAttempts, reviewCycles, totalAgentExecutions, createdAt, updatedAt]
          properties:
            issueExternalId: { type: string }
            issueTitle: { type: string }
            branchName: { type: string }
            pullRequestExternalId: { type: string }
            pullRequestUrl: { type: string }
            pullRequestState: { type: string }
            blockingReason: { type: string }
            planningAttempts: { type: integer, minimum: 0 }
            implementationAttempts: { type: integer, minimum: 0 }
            pipelineRepairAttempts: { type: integer, minimum: 0 }
            ciRepairAttempts: { type: integer, minimum: 0 }
            reviewCycles: { type: integer, minimum: 0 }
            totalAgentExecutions:
              type: integer
              minimum: 0
              description: >-
                Agent executions spent across every role. The cap it is measured
                against lives in the orchestrator's RetryBudget.
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    WorkflowEvent:
      type: object
      required: [id, type, createdAt, payload]
      properties:
        id: { type: string }
        type: { type: string }
        createdAt: { type: string, format: date-time }
        payload: {}
    WorkflowEventsPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/WorkflowEvent' }
        nextCursor: { type: string }
    Health:
      type: object
      required: [status, orchestrator]
      properties:
        status: { type: string, enum: [healthy, degraded] }
        orchestrator: { type: string, enum: [reachable, unreachable] }
    SchedulerMetrics:
      type: object
      required: [queueDepth, activeWorkflows, scheduledJobs]
      properties:
        queueDepth: { type: integer }
        activeWorkflows: { type: integer }
        scheduledJobs: { type: integer }
