openapi: 3.1.0
info:
  title: Moirai Public API
  version: 0.1.0
  description: |
    HTTP gateway for the Moirai control plane. The API uses the `loop_session`
    cookie created by the login endpoint. Mutating authenticated requests also
    require the `X-CSRF-Token` header to equal the `loop_csrf` cookie value.
servers:
  - url: http://localhost:8080
paths:
  /api/v1/scheduler/metrics:
    get:
      summary: Get scheduler summary metrics
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Scheduler metrics
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SchedulerMetrics'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/queue:
    get:
      summary: List the pending scheduling queue
      description: |
        Issues eligible for scheduling, highest priority first, as the
        orchestrator's `ListQueue` returns them. Entries are a projection of
        queued issues, not workflows: nothing here has started yet, so there is
        no workflow ID to link to.
      security:
        - sessionCookie: []
      parameters:
        - name: limit
          in: query
          description: Maximum entries to return.
          schema: { type: integer, minimum: 1, maximum: 100, default: 50 }
      responses:
        '200':
          description: Queue entries, highest priority first
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/QueueEntry'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
        '504':
          $ref: '#/components/responses/OrchestratorTimeout'
  /metrics:
    get:
      summary: Prometheus exposition of the API's own metrics
      description: |
        Request counts and latencies for the routes this service serves, plus
        its orchestrator client metrics. Queue depth, active workflow counts and
        runner heartbeat age are orchestrator-owned and are scraped from the
        orchestrator's own metrics listener instead.
      responses:
        '200':
          description: Metrics in the Prometheus text exposition format
          content:
            text/plain:
              schema: { type: string }
  /live:
    get:
      summary: Liveness probe
      responses:
        '200':
          description: API process is alive
  /ready:
    get:
      summary: Readiness probe
      responses:
        '200':
          description: The orchestrator connection is reachable
        '503':
          $ref: '#/components/responses/ServiceUnavailable'
  /api/v1/health:
    get:
      summary: API and orchestrator health
      responses:
        '200':
          description: Both services are healthy
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
        '503':
          description: The API is running but the orchestrator is unreachable
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Health'
  /api/v1/auth/login:
    post:
      summary: Create a browser session
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: Session cookies were set
          headers:
            Set-Cookie:
              schema:
                type: string
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LoginResponse'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
        '429':
          description: Login rate limit exceeded
  /api/v1/auth/logout:
    post:
      summary: Revoke the session and clear the browser cookies
      description: >-
        Revokes the caller's session server-side (so a captured session token
        no longer works) and clears the session and CSRF cookies. Requires a
        session cookie, so a call with no session is answered 401 rather than
        a no-op 204 -- there is nothing to revoke and nothing sensitive in
        saying so, consistent with every other session-protected route.
      security:
        - sessionCookie: []
          csrfToken: []
      responses:
        '204':
          description: Session revoked and cookies cleared
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
  /api/v1/auth/me:
    get:
      summary: Get the authenticated user
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/auth/account:
    put:
      summary: Update the authenticated user's account
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AccountUpdate'
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/projects:
    get:
      summary: List projects
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Projects
          content:
            application/json:
              schema:
                type: object
                required: [projects]
                properties:
                  projects:
                    type: array
                    items:
                      $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a project
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectConfiguration'
      responses:
        '201':
          description: Project created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/projects/{project_id}:
    put:
      summary: Replace a project configuration
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectConfiguration'
      responses:
        '200':
          description: Updated project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/projects/{project_id}/enable:
    post:
      summary: Enable scheduling for a project
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Enabled project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{project_id}/disable:
    post:
      summary: Disable scheduling for a project
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Disabled project
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Project'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/task-source-types:
    get:
      summary: Discover every task source provider and its configuration fields
      description: |
        The generic, provider-agnostic console form (#294/#345) is rendered
        entirely from this response: no field name or provider id is
        hardcoded client-side. Any signed-in session may read it.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Task source types
          content:
            application/json:
              schema:
                type: object
                required: [types]
                properties:
                  types:
                    type: array
                    items:
                      $ref: '#/components/schemas/TaskSourceTypeDescriptor'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/projects/{project_id}/task-sources:
    post:
      summary: Configure a new task source for a project
      description: |
        `configuration` and `secrets` are validated server-side against the
        named provider's descriptor (see GET /api/v1/task-source-types). A
        secret field's value is write-only and never appears in any response.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSourceCreate'
      responses:
        '201':
          description: Task source created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/task-sources/{task_source_id}:
    put:
      summary: Update a task source
      description: |
        A secret field this request's `secrets` map omits keeps whatever
        value was previously configured for it -- editing name, enabled, or
        an unrelated configuration field never blanks a configured secret.
        Clearing a secret is explicit, via `clearSecrets`.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TaskSourceID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/TaskSourceUpdate'
      responses:
        '200':
          description: Updated task source
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TaskSource'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Remove a task source
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TaskSourceID'
      responses:
        '204':
          description: Task source removed
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{project_id}/credentials:
    get:
      summary: Report which credentials a project has configured
      description: |
        Returns presence and timestamps only. A stored credential value is
        never returned by this API — replacing it is the only way to change it.
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
      responses:
        '200':
          description: Configured credentials
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCredentialList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/projects/{project_id}/credentials/{kind}:
    put:
      summary: Store or replace one project credential
      description: |
        The value is encrypted at rest with the deployment's `LOOP_SECRET_KEY`.
        Requests are rejected with 422 when no key is configured, because a
        credential written without one could not be read back.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/CredentialKind'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ProjectCredentialValue'
      responses:
        '200':
          description: Configured credentials after the write
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCredentialList'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
    delete:
      summary: Remove one project credential
      description: |
        The project falls back to the deployment-wide credential. Removing a
        credential that is not configured succeeds.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/ProjectID'
        - $ref: '#/components/parameters/CredentialKind'
      responses:
        '200':
          description: Configured credentials after the removal
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ProjectCredentialList'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/runner-tokens:
    get:
      summary: List runner registration tokens
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Registration tokens
          content:
            application/json:
              schema:
                type: object
                required: [tokens]
                properties:
                  tokens:
                    type: array
                    items:
                      $ref: '#/components/schemas/RunnerToken'
        '401':
          $ref: '#/components/responses/Unauthorized'
    post:
      summary: Create a runner registration token
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [allowedLabels]
              properties:
                allowedLabels:
                  type: array
                  items:
                    type: string
      responses:
        '201':
          description: Registration token; retain the token value because it is not returned by list.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CreatedRunnerToken'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/runner-tokens/{token_id}:
    delete:
      summary: Revoke a runner registration token
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/TokenID'
      responses:
        '204':
          description: Token revoked
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
  /api/v1/runners:
    get:
      summary: List registered runners
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Runners
          content:
            application/json:
              schema:
                type: object
                required: [runners]
                properties:
                  runners:
                    type: array
                    items:
                      $ref: '#/components/schemas/Runner'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/runners/{runner_id}/drain:
    post:
      summary: Drain a runner after its active job
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RunnerID'
      responses:
        '200': { description: Draining runner, content: { application/json: { schema: { $ref: '#/components/schemas/Runner' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runners/{runner_id}/undrain:
    post:
      summary: Resume a drained runner
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RunnerID'
      responses:
        '200': { description: Available runner, content: { application/json: { schema: { $ref: '#/components/schemas/Runner' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/runners/{runner_id}/revoke:
    post:
      summary: Revoke a runner credential
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/RunnerID'
      responses:
        '200': { description: Revoked runner, content: { application/json: { schema: { $ref: '#/components/schemas/Runner' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/sync/status:
    get:
      summary: Per-project issue synchronization status
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Sync status for every project
          content:
            application/json:
              schema:
                type: object
                required: [entries]
                properties:
                  entries:
                    type: array
                    items:
                      $ref: '#/components/schemas/IssueSyncStatusEntry'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/sync:
    post:
      summary: Run an issue-synchronization pass now
      description: |
        Empty body syncs every enabled project; a body with `projectId` syncs
        only that project and clears any in-memory backoff it was under.
      security:
        - sessionCookie: []
          csrfToken: []
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                projectId:
                  type: string
      responses:
        '200':
          description: Per-project sync results
          content:
            application/json:
              schema:
                type: object
                required: [results]
                properties:
                  results:
                    type: array
                    items:
                      $ref: '#/components/schemas/SyncResult'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '504':
          $ref: '#/components/responses/OrchestratorTimeout'
  /api/v1/events:
    get:
      summary: Stream workflow and runner state changes
      description: |
        Long-lived Server-Sent Events stream. Browser EventSource reconnects with
        the most recent event ID through the Last-Event-ID header. Events are
        named `workflow` and `runner`; keep-alive comments are not events.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Event stream remains open until client disconnect or shutdown
          content:
            text/event-stream:
              schema:
                type: string
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workflows:
    get:
      summary: List workflows
      description: |
        Every row carries the same fields as `GET /api/v1/workflows/{workflow_id}`.
        The console renders issue titles, pull requests and attempt budgets in the
        list, the overview and the phase threads; a summary shape would cost one
        detail request per workflow.
      security:
        - sessionCookie: []
      responses:
        '200':
          description: Workflows
          content:
            application/json:
              schema:
                type: object
                required: [workflows]
                properties:
                  workflows:
                    type: array
                    items:
                      $ref: '#/components/schemas/WorkflowDetail'
        '401':
          $ref: '#/components/responses/Unauthorized'
  /api/v1/workflows/{workflow_id}:
    get:
      summary: Get workflow details
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      responses:
        '200': { description: Workflow details, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowDetail' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workflows/{workflow_id}/events:
    get:
      summary: List workflow events newest first
      security:
        - sessionCookie: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
        - name: cursor
          in: query
          schema: { type: string }
        - name: limit
          in: query
          schema: { type: integer, minimum: 1, maximum: 100, default: 100 }
      responses:
        '200': { description: Workflow events, content: { application/json: { schema: { $ref: '#/components/schemas/WorkflowEventsPage' } } } }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /api/v1/workflows/{workflow_id}/decision:
    post:
      summary: Submit a required human decision
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision:
                  type: string
                  enum: [approved, changes_requested]
                comment:
                  type: string
      responses:
        '200':
          description: Workflow after the decision
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Workflow'
        '400':
          $ref: '#/components/responses/BadRequest'
        '401':
          $ref: '#/components/responses/Unauthorized'
        '403':
          $ref: '#/components/responses/Forbidden'
        '404':
          $ref: '#/components/responses/NotFound'
        '422':
          $ref: '#/components/responses/ValidationError'
  /api/v1/workflows/{workflow_id}/retry:
    post:
      summary: Retry a terminal workflow
      description: |
        Restarts a terminal workflow run. By default the run is superseded and
        the issue is scheduled again from scratch. Set `resume: true` in the
        request body to instead re-dispatch the run's current step with its
        accumulated context (plan, branch and previous failure account). A run
        that failed at the independent review step cannot be resumed and must be
        retried from scratch.
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowControlRequest' }
      responses:
        '200': { description: Workflow resumed, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/workflows/{workflow_id}/cancel:
    post:
      summary: Cancel an in-flight workflow
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowControlRequest' }
      responses:
        '200': { description: Workflow cancelled, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /api/v1/workflows/{workflow_id}/block:
    post:
      summary: Block an in-flight workflow
      security:
        - sessionCookie: []
          csrfToken: []
      parameters:
        - $ref: '#/components/parameters/WorkflowID'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/WorkflowControlRequest' }
      responses:
        '200': { description: Workflow blocked, content: { application/json: { schema: { $ref: '#/components/schemas/Workflow' } } } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
components:
  securitySchemes:
    sessionCookie:
      type: apiKey
      in: cookie
      name: loop_session
    csrfToken:
      type: apiKey
      in: header
      name: X-CSRF-Token
  parameters:
    ProjectID:
      name: project_id
      in: path
      required: true
      schema: { type: string }
    TaskSourceID:
      name: task_source_id
      in: path
      required: true
      schema: { type: string }
    TokenID:
      name: token_id
      in: path
      required: true
      schema: { type: string }
    RunnerID:
      name: runner_id
      in: path
      required: true
      schema: { type: string }
    WorkflowID:
      name: workflow_id
      in: path
      required: true
      schema: { type: string }
    CredentialKind:
      name: kind
      in: path
      required: true
      description: >-
        `github_token`, `ssh_private_key`, or `agent:<NAME>` where `<NAME>` is
        the environment variable an agent harness reads the credential from,
        e.g. `agent:OPENROUTER_API_KEY`. Percent-encode the colon in the path.
      schema:
        type: string
        pattern: '^(github_token|ssh_private_key|agent:[A-Z_][A-Z0-9_]{0,127})$'
  responses:
    BadRequest:
      description: Malformed request
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    Unauthorized:
      description: Authentication is required or invalid
    Forbidden:
      description: A CSRF token is required for this mutation
    NotFound:
      description: Requested resource was not found
    ValidationError:
      description: The control plane rejected valid JSON input
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    ServiceUnavailable:
      description: A dependent service is unavailable
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
    OrchestratorTimeout:
      description: The orchestrator did not answer before the request deadline
      content:
        application/problem+json:
          schema: { $ref: '#/components/schemas/Problem' }
  schemas:
    Problem:
      type: object
      description: >-
        The error body every failing route returns, served as
        `application/problem+json`. `detail` is omitted when the API has
        nothing to add beyond the title.
      required: [status, title]
      properties:
        status: { type: integer }
        title: { type: string }
        detail: { type: string }
    LoginRequest:
      type: object
      required: [username, password]
      properties:
        username: { type: string }
        password: { type: string, format: password }
    LoginResponse:
      type: object
      required: [userId]
      properties:
        userId: { type: string }
    User:
      type: object
      required: [userId, username, role]
      properties:
        userId: { type: string }
        username: { type: string }
        role: { type: string }
        email: { type: string }
        displayName: { type: string }
    AccountUpdate:
      type: object
      properties:
        currentPassword: { type: string }
        newPassword: { type: string }
        newEmail: { type: string }
        displayName: { type: string }
    ProjectConfiguration:
      type: object
      properties:
        name: { type: string }
        repositoryMode: { type: string }
        repositoryUrl: { type: string }
        localRepositoryPath: { type: string }
        defaultBranch: { type: string }
        requiredRunnerLabels:
          type: array
          items: { type: string }
        pipelineSteps:
          type: array
          items: { $ref: '#/components/schemas/PipelineStep' }
        executionImage:
          type: string
          description: Docker image used for agent and pipeline execution; empty uses runner environment.
        requireHumanApproval:
          type: boolean
          description: >-
            Opt-in human-approval gate: when true, a run stops at the
            'waiting_human' status once every automated gate (implementation,
            GitHub checks) passes, and only merges once an admin approves it
            via the decision panel. Defaults to false.
        requirePlanning:
          type: boolean
          description: >-
            Opt-in planning gate (#351): when true, the orchestrator dispatches
            a planner execution before the developer one, and its output feeds
            the developer packet's context. A run sits at the 'planning' status
            while that execution runs. Defaults to false.
    Project:
      type: object
      required: [id, name, enabled]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        repositoryMode: { type: string }
        repositoryUrl:
          type: string
          description: >-
            Clone source for managed_clone projects. Userinfo (embedded
            credentials) is never returned; any present userinfo is replaced
            with a redacted placeholder.
        localRepositoryPath: { type: string }
        defaultBranch: { type: string }
        requiredRunnerLabels:
          type: array
          items: { type: string }
        pipelineSteps:
          type: array
          items: { $ref: '#/components/schemas/PipelineStep' }
        executionImage:
          type: string
          description: Docker image used for agent and pipeline execution; empty uses runner environment.
        requireHumanApproval:
          type: boolean
          description: >-
            Opt-in human-approval gate: when true, a run stops at the
            'waiting_human' status once every automated gate (implementation,
            GitHub checks) passes, and only merges once an admin approves it
            via the decision panel. Defaults to false.
        requirePlanning:
          type: boolean
          description: >-
            Opt-in planning gate (#351): when true, the orchestrator dispatches
            a planner execution before the developer one, and its output feeds
            the developer packet's context. A run sits at the 'planning' status
            while that execution runs. Defaults to false.
        taskSources:
          type: array
          items: { $ref: '#/components/schemas/TaskSource' }
          description: This project's configured task sources (see /api/v1/task-source-types).
    PipelineStep:
      type: object
      required: [command, timeoutSeconds, position, required]
      properties:
        command: { type: string }
        timeoutSeconds: { type: integer, minimum: 1 }
        position: { type: integer, minimum: 0 }
        required: { type: boolean }
    ProjectCredentialList:
      type: object
      required: [credentials]
      properties:
        credentials:
          type: array
          items: { $ref: '#/components/schemas/ProjectCredential' }
    ProjectCredential:
      type: object
      required: [kind, createdAt, updatedAt]
      description: >-
        A credential this project has configured. The value is deliberately
        absent: it is write-only through every layer of the system.
      properties:
        kind:
          type: string
          pattern: '^(github_token|ssh_private_key|agent:[A-Z_][A-Z0-9_]{0,127})$'
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
        filePath:
          type: string
          description: >-
            Where the harness reads this credential from, relative to the home
            directory the runner builds for the execution. Empty means it is
            delivered as an environment variable. A destination, not a secret,
            which is why it is reported and the value never is.
    ProjectCredentialValue:
      type: object
      required: [value]
      properties:
        value:
          type: string
          format: password
          description: >-
            The credential itself — a token, PEM private-key material, or a
            provider API key or credentials document. Must not be blank; use
            DELETE to remove a credential.
        filePath:
          type: string
          description: >-
            Only for an `agent:<NAME>` kind. Deliver the credential as a file at
            this path below the execution's home directory instead of as an
            environment variable; the variable then carries the path. Must be
            relative, with no `..` segment. Required for a subscription harness
            that reads its credentials from `~/...`, because the runner
            overrides HOME to a throwaway directory.
    TaskSourceField:
      type: object
      required: [key, label, kind, required, options]
      description: >-
        One configuration input a TaskSourceTypeDescriptor declares. `kind`
        determines the form control the console renders: `text`, `number`,
        `bool`, `enum`, `string_list`, or `secret`.
      properties:
        key: { type: string }
        label: { type: string }
        help: { type: string }
        kind:
          type: string
          enum: [text, number, bool, enum, string_list, secret]
        required: { type: boolean }
        defaultValue:
          description: >-
            The field's default, JSON-decoded (a string, number, boolean, or
            array depending on `kind`). Absent when the field has none, and
            always absent for a `secret` field.
        options:
          type: array
          items: { type: string }
          description: Valid values for an `enum` field; empty for every other kind.
        pattern:
          type: string
          description: A regexp a `text` field's value must match; empty when unconstrained.
    TaskSourceTypeDescriptor:
      type: object
      required: [id, displayName, fields]
      properties:
        id: { type: string }
        displayName: { type: string }
        fields:
          type: array
          items: { $ref: '#/components/schemas/TaskSourceField' }
    TaskSourceSecretField:
      type: object
      required: [key, configured]
      description: Whether a secret field has a value configured -- never the value itself.
      properties:
        key: { type: string }
        configured: { type: boolean }
    TaskSource:
      type: object
      required: [id, provider, name, enabled, configuration, secrets]
      properties:
        id: { type: string }
        provider: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        configuration:
          type: object
          description: Non-secret configuration fields, shaped by this provider's descriptor. Never contains a secret field's value.
        secrets:
          type: array
          items: { $ref: '#/components/schemas/TaskSourceSecretField' }
    TaskSourceCreate:
      type: object
      required: [provider, name, enabled, configuration]
      properties:
        provider: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        configuration:
          type: object
          description: Non-secret fields only, as declared by the provider's descriptor.
        secrets:
          type: object
          additionalProperties: { type: string }
          description: >-
            Secret field key -> value, write-only. Every required secret
            field needs an entry.
    TaskSourceUpdate:
      type: object
      required: [name, enabled, configuration]
      properties:
        name: { type: string }
        enabled: { type: boolean }
        configuration:
          type: object
        secrets:
          type: object
          additionalProperties: { type: string }
          description: >-
            Only the secret fields present here are replaced. A field this
            object omits keeps whatever was previously configured for it --
            leave it out entirely, do not send an empty string.
        clearSecrets:
          type: array
          items: { type: string }
          description: Secret field keys to explicitly clear.
    RunnerToken:
      type: object
      required: [id, allowedLabels, expiresAt]
      properties:
        id: { type: string }
        allowedLabels:
          type: array
          items: { type: string }
        expiresAt: { type: string }
        usedAt: { type: string }
        revokedAt: { type: string }
    CreatedRunnerToken:
      type: object
      required: [token, expiresAt]
      properties:
        token: { type: string }
        expiresAt: { type: string }
    Runner:
      type: object
      required: [id, name, enabled, draining, status, version, labels, lastSeenAt]
      properties:
        id: { type: string }
        name: { type: string }
        enabled: { type: boolean }
        draining: { type: boolean }
        status: { type: string }
        version: { type: string, maxLength: 12 }
        labels:
          type: array
          items: { type: string }
        lastSeenAt: { type: string }
    SyncResult:
      type: object
      required: [projectId, syncedIssues]
      properties:
        projectId: { type: string }
        syncedIssues: { type: integer }
        error: { type: string }
    IssueSyncStatusEntry:
      type: object
      required: [projectId, projectName, enabled, issueCount, eligibleCount, consecutiveFailures, backingOff]
      properties:
        projectId: { type: string }
        projectName: { type: string }
        enabled: { type: boolean }
        issueCount: { type: integer }
        eligibleCount: { type: integer }
        lastSyncedAt: { type: string }
        consecutiveFailures: { type: integer }
        nextRetryAt: { type: string }
        lastError: { type: string }
        backingOff: { type: boolean }
    WorkflowControlRequest:
      type: object
      properties:
        reason: { type: string, maxLength: 1024 }
        resume:
          type: boolean
          description: When true, restart the current step with its accumulated context instead of starting from scratch. Only valid on retry.
    Workflow:
      type: object
      required: [id, projectId, status, phase]
      properties:
        id: { type: string }
        projectId: { type: string }
        status: { type: string }
        phase: { type: string }
    WorkflowDetail:
      allOf:
        - $ref: '#/components/schemas/Workflow'
        - type: object
          required: [issueExternalId, issueTitle, branchName, planningAttempts, implementationAttempts, pipelineRepairAttempts, ciRepairAttempts, reviewCycles, totalAgentExecutions, planSummary, createdAt, updatedAt]
          properties:
            issueExternalId: { type: string }
            issueTitle: { type: string }
            branchName: { type: string }
            pullRequestExternalId: { type: string }
            pullRequestUrl: { type: string }
            pullRequestState: { type: string }
            blockingReason: { type: string }
            planningAttempts: { type: integer, minimum: 0 }
            implementationAttempts: { type: integer, minimum: 0 }
            pipelineRepairAttempts: { type: integer, minimum: 0 }
            ciRepairAttempts: { type: integer, minimum: 0 }
            reviewCycles: { type: integer, minimum: 0 }
            totalAgentExecutions:
              type: integer
              minimum: 0
              description: >-
                Agent executions spent across every role. The cap it is measured
                against lives in the orchestrator's RetryBudget.
            planSummary:
              type: string
              description: >-
                The planning phase's own account of the work (#351): the
                planner execution's summary, or empty when the project never
                opted into requirePlanning or the run has not reached that
                phase yet.
            createdAt: { type: string, format: date-time }
            updatedAt: { type: string, format: date-time }
    WorkflowEvent:
      type: object
      required: [id, type, createdAt, payload]
      properties:
        id: { type: string }
        type: { type: string }
        createdAt: { type: string, format: date-time }
        payload: {}
    WorkflowEventsPage:
      type: object
      required: [events]
      properties:
        events:
          type: array
          items: { $ref: '#/components/schemas/WorkflowEvent' }
        nextCursor: { type: string }
    Health:
      type: object
      required: [status, orchestrator]
      properties:
        status: { type: string, enum: [healthy, degraded] }
        orchestrator: { type: string, enum: [reachable, unreachable] }
        apiVersion: { type: string, maxLength: 12 }
        orchestratorVersion: { type: string, maxLength: 12 }
    SchedulerMetrics:
      type: object
      required: [queueDepth, activeWorkflows, scheduledJobs, loops]
      properties:
        queueDepth: { type: integer }
        activeWorkflows: { type: integer }
        scheduledJobs: { type: integer }
        loops:
          type: array
          description: >-
            Liveness of each orchestrator background loop (scheduler tick,
            workflow observer, recovery sweep, issue sync). A loop is
            unhealthy once its last success has aged past a threshold sized
            to its own tick interval.
          items:
            $ref: '#/components/schemas/LoopStatus'
    QueueEntry:
      type: object
      description: >-
        One issue waiting to be scheduled. Every field is always present; the
        API emits the empty string rather than null when the orchestrator has
        no value, so `blockedReason` is empty for an entry that is merely
        waiting its turn.
      required: [projectId, projectName, externalId, title, priority, blockedReason]
      properties:
        projectId: { type: string }
        projectName: { type: string }
        externalId:
          type: string
          description: Issue identifier in the task source, e.g. a GitHub issue number.
        title: { type: string }
        priority: { type: integer, format: int32 }
        blockedReason:
          type: string
          description: >-
            Why this entry cannot start yet -- for example the project already
            has a workflow running. Empty when nothing is holding it back.
    LoopStatus:
      type: object
      required: [name, healthy]
      properties:
        name: { type: string }
        healthy: { type: boolean }
        lastSuccessAt: { type: string, format: date-time }
        lastError: { type: string }
        lastErrorAt: { type: string, format: date-time }
