# Read every secret from a file under ./secrets/ instead of the environment.
#
#   mkdir -p secrets
#   printf '%s\n' 'a-strong-postgres-password' > secrets/postgres_password
#   printf '%s\n' 'postgresql+asyncpg://loop:a-strong-postgres-password@postgres:5432/loop' > secrets/database_url
#   printf '%s\n' 'A-Strong-Admin-Password-1' > secrets/initial_admin_password
#   printf '%s\n' 'github-token-with-repo-and-workflow-scopes' > secrets/github_token
#   openssl rand -hex 32 > secrets/runner_registration_token
#   chmod 600 secrets/*
#   docker compose -f compose.yaml -f compose.secrets.yaml up -d
#
# Why bother: values passed as environment are visible to `docker inspect` and
# to anything that renders a container's configuration, including Portainer's
# own UI. File secrets are not. Both entrypoints prefer the file when one is
# present, so this overlay only has to add the mounts and blank the variables.
#
# `!reset` removes the key compose.yaml set rather than overriding it -- an
# empty string would still be *present*, and a secret that is present but blank
# is rejected as a misconfiguration rather than read as "use the file".
#
# It needs files on the Docker host, so it is for a machine you have a shell on,
# not for a Portainer stack pasted into the web editor.

services:
  postgres:
    environment:
      POSTGRES_PASSWORD: !reset null
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]

  orchestrator:
    environment:
      LOOP_DATABASE_URL: !reset null
      LOOP_INITIAL_ADMIN_PASSWORD: !reset null
      RUNNER_REGISTRATION_TOKEN: !reset null
      LOOP_GITHUB_TOKEN: !reset null
    secrets: [database_url, initial_admin_password, runner_registration_token, github_token]

  runner:
    environment:
      LOOP_RUNNER_REGISTRATION_TOKEN: !reset null
      GITHUB_TOKEN: !reset null
      GITHUB_TOKEN_FILE: /run/secrets/github_token
    secrets: [runner_registration_token, github_token]

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  initial_admin_password:
    file: ./secrets/initial_admin_password
  github_token:
    file: ./secrets/github_token
  runner_registration_token:
    file: ./secrets/runner_registration_token
