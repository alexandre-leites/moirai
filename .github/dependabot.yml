version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /api
    schedule:
      interval: weekly
  - package-ecosystem: gomod
    directory: /runner
    schedule:
      interval: weekly
  - package-ecosystem: pip
    directory: /orchestrator
    schedule:
      interval: weekly
  - package-ecosystem: npm
    directory: /web
    schedule:
      interval: weekly
  # Every Dockerfile base image is pinned to a digest for reproducibility, which
  # only stays safe while something keeps moving the pins forward.
  - package-ecosystem: docker
    directories:
      - /api
      - /orchestrator
      - /runner
      - /web
    schedule:
      interval: weekly
