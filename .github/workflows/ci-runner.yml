# Builds and publishes the ci-runner image -- the GitHub Actions self-hosted
# runner for the `self-hosted`/`linux` pool, with the pipeline toolchain baked
# in (see infra/ci-runner/README.md). The autoscaler project starts one
# container per job from this image.
#
# This is deliberately a separate workflow from release.yml: it publishes a
# build *environment*, not a product artifact, on its own cadence. It runs:
#   - on pull requests that touch the runner definition (or this file), where
#     a build job validates the Dockerfile and shell scripts (amd64 only,
#     no push) so a broken image cannot reach main;
#   - on every push to main that touches the runner definition (or this file),
#     so a tool bump is reviewed, merged, and published in one flow;
#   - on a weekly schedule, so the baked toolchain does not silently rot;
#   - on workflow_dispatch, for an ad-hoc rebuild.
#
# The arm64 leg (TARGETARCH URLs and checksums) is only exercised by the
# publish job, i.e. after merge to main and on the weekly cadence.
#
# Both jobs follow the same resolve-runner pattern as ci.yml: they run on the
# self-hosted pool when CI_SELFHOSTED_RUNNERS is "true", GitHub-hosted
# ubuntu-latest otherwise. While the pool still runs its previous image it can
# build the ci-runner image itself; once the pool moves onto the ci-runner
# image, this workflow must fall back to GitHub-hosted runners (the image
# cannot build itself) by clearing that variable or excluding this workflow.

name: CI Runner image

on:
  push:
    branches: [main]
    paths:
      - "infra/ci-runner/**"
      - ".github/workflows/ci-runner.yml"
  pull_request:
    paths:
      - "infra/ci-runner/**"
      - ".github/workflows/ci-runner.yml"
  schedule:
    - cron: "0 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: ci-runner-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository }}/ci-runner
  PLATFORMS: linux/amd64,linux/arm64
  # True selects the self-hosted pool; unset or any other value selects
  # GitHub-hosted runners. Set it as a repository variable. The pool currently
  # runs a different image, so it can build the ci-runner image itself.
  CI_SELFHOSTED_RUNNERS: ${{ vars.CI_SELFHOSTED_RUNNERS || 'false' }}

jobs:
  resolve-runner:
    runs-on: ["self-hosted", "linux"]
    outputs:
      runner: ${{ steps.resolve.outputs.runner }}
    steps:
      - name: Select runner pool
        id: resolve
        run: |
          if [[ "${CI_SELFHOSTED_RUNNERS,,}" == "true" ]]; then
            echo "runner=[\"self-hosted\", \"linux\"]" >> "$GITHUB_OUTPUT"
            echo "::notice::CI_SELFHOSTED_RUNNERS=true -- running on the self-hosted pool."
          else
            echo "runner=[\"ubuntu-latest\"]" >> "$GITHUB_OUTPUT"
          fi

  # PR-only gate: builds the image (amd64, no push) and syntax-checks the shell
  # scripts so a broken Dockerfile/entrypoint is caught before merge. Uses the
  # Actions cache (type=gha) restored from main; never logs in to GHCR and never
  # writes the registry buildcache.
  build:
    if: github.event_name == 'pull_request'
    needs: resolve-runner
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Shell syntax check
        run: |
          set -eu
          bash -n infra/ci-runner/entrypoint.sh
          bash -n infra/ci-runner/wrapper.sh
          bash -n infra/ci-runner/run-container.sh

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Build (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/ci-runner/Dockerfile
          platforms: linux/amd64
          push: false
          cache-from: type=gha

  publish:
    if: github.event_name != 'pull_request'
    needs: resolve-runner
    runs-on: ${{ fromJSON(needs.resolve-runner.outputs.runner) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The arm64 build runs under QEMU. Pinned to the same emulator release as
      # release.yml (qemu-v9.2.2) with cache-image: false, so a cached binfmt
      # layer cannot silently reintroduce an older, buggier emulator.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64
          image: tonistiigi/binfmt:qemu-v9.2.2
          cache-image: false

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Every publish refreshes `latest` and `sha-<short>`; the version tags
      # come from infra/ci-runner/VERSION and name a toolchain generation.
      # Bump VERSION when a meaningful tool change lands so the pool can be
      # pointed at a specific generation instead of always `latest`.
      - name: Compute image tags
        id: tags
        run: |
          set -eu
          version="$(cat infra/ci-runner/VERSION)"
          major_minor="${version%.*}"
          {
            echo "version=${version}"
            echo 'tags<<TAGS_EOF'
            echo "${IMAGE}:latest"
            echo "${IMAGE}:${version}"
            echo "${IMAGE}:${major_minor}"
            echo "${IMAGE}:sha-${GITHUB_SHA::7}"
            echo 'TAGS_EOF'
          } >> "$GITHUB_OUTPUT"
          echo "publishing ${IMAGE} as latest, ${version}, ${major_minor}, sha-${GITHUB_SHA::7}"

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: infra/ci-runner/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: true
          tags: ${{ steps.tags.outputs.tags }}
          cache-from: type=registry,ref=${{ env.IMAGE }}:buildcache
          cache-to: type=registry,ref=${{ env.IMAGE }}:buildcache,mode=max,image-manifest=true,oci-mediatypes=true
