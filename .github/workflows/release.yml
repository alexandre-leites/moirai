# Publishes the four service images to GitHub Container Registry.
#
# Trigger contract (the authoritative description lives in docs/release.md, and
# the derivation itself is scripts/release-version.sh, tested by
# scripts/release-version_test.sh, which this workflow runs before it derives
# anything):
#
#   push to release/X.Y.Z    -> X.Y.Z-rc.<run number>, X.Y.Z-rc, sha-<short>
#   GitHub Release vX.Y.Z    -> X.Y.Z, X.Y, X, sha-<short>, and latest when the
#                               release is not a pre-release and is the release
#                               GitHub currently reports as newest
#   GitHub Release vX.Y.Z-rc -> X.Y.Z-rc, sha-<short>
#   workflow_dispatch        -> builds every image for every architecture and
#                               publishes nothing
#
# Pushing a bare git tag publishes nothing. A GitHub Release has to be
# published, which is what makes "release" an intentional act rather than a
# side effect of tagging.
name: Release

on:
  push:
    branches:
      - "release/**"
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

# Releases are never cancelled mid-publish: a half-pushed manifest list is worse
# than a slow queue. Runs are serialised per ref so two pushes to the same
# release branch cannot race for the same moving tag.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}
  PLATFORMS: linux/amd64,linux/arm64

jobs:
  plan:
    name: Plan release
    runs-on: [self-hosted, linux]
    outputs:
      version: ${{ steps.plan.outputs.version }}
      channel: ${{ steps.plan.outputs.channel }}
      push: ${{ steps.plan.outputs.push }}
      tags: ${{ steps.plan.outputs.tags }}
      created: ${{ steps.created.outputs.created }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # The mapping from trigger to image tags is a contract, so it is verified
      # before it is used. A change that breaks it fails here instead of
      # publishing images under the wrong tags.
      - name: Verify the trigger to tag mapping
        run: sh scripts/release-version_test.sh

      # `latest` must only ever move forward. Publishing a patch for an older
      # line (v1.3.5 after v1.4.0) must not drag `latest` backwards, so the tag
      # is only claimed when GitHub itself reports this release as the newest.
      - name: Resolve whether this release is the newest one
        id: newest
        if: github.event_name == 'release'
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          status=$(curl --silent --show-error --output /tmp/latest-release.json \
            --write-out '%{http_code}' \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header 'Accept: application/vnd.github+json' \
            --header 'X-GitHub-Api-Version: 2022-11-28' \
            "$GITHUB_API_URL/repos/$GITHUB_REPOSITORY/releases/latest")
          case "$status" in
            200)
              newest=$(sed -n 's/.*"tag_name"[[:space:]]*:[[:space:]]*"\([^"]*\)".*/\1/p' \
                /tmp/latest-release.json | head -n 1)
              ;;
            404)
              # No non-prerelease release exists yet, so nothing can be newest.
              newest=''
              ;;
            *)
              echo "releases/latest lookup failed with HTTP $status" >&2
              exit 1
              ;;
          esac
          rm -f /tmp/latest-release.json
          if [ "$newest" = "$RELEASE_TAG" ]; then
            echo "make_latest=true" >> "$GITHUB_OUTPUT"
          else
            echo "make_latest=false" >> "$GITHUB_OUTPUT"
          fi
          echo "GitHub reports '$newest' as the newest release; this run is '$RELEASE_TAG'."

      - name: Derive version and image tags
        id: plan
        env:
          EVENT_NAME: ${{ github.event_name }}
          REF: ${{ github.event_name == 'release' && format('refs/tags/{0}', github.event.release.tag_name) || github.ref }}
          SHA: ${{ github.sha }}
          RUN_NUMBER: ${{ github.run_number }}
          PRERELEASE: ${{ (github.event_name == 'release' && github.event.release.prerelease) || false }}
          MAKE_LATEST: ${{ steps.newest.outputs.make_latest || 'true' }}
        run: |
          set -eu
          # Deliberately not piped into tee: the default shell for `run` has no
          # pipefail, so a piped failure of the derivation would be masked by
          # tee's exit status and the release would proceed with no plan.
          sh scripts/release-version.sh > /tmp/release-plan.env
          cat /tmp/release-plan.env
          cat /tmp/release-plan.env >> "$GITHUB_OUTPUT"
          rm -f /tmp/release-plan.env

      - name: Record the build timestamp
        id: created
        run: echo "created=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> "$GITHUB_OUTPUT"

      - name: Summarise the plan
        env:
          VERSION: ${{ steps.plan.outputs.version }}
          CHANNEL: ${{ steps.plan.outputs.channel }}
          PUSH: ${{ steps.plan.outputs.push }}
          TAGS: ${{ steps.plan.outputs.tags }}
        run: |
          set -eu
          {
            echo "### Release plan"
            echo
            echo "| field | value |"
            echo "| --- | --- |"
            echo "| trigger | \`${{ github.event_name }}\` on \`${{ github.ref }}\` |"
            echo "| version | \`$VERSION\` |"
            echo "| channel | \`$CHANNEL\` |"
            echo "| publishes | \`$PUSH\` |"
            echo "| platforms | \`$PLATFORMS\` |"
            echo "| tags | \`$TAGS\` |"
          } >> "$GITHUB_STEP_SUMMARY"

  images:
    name: Build ${{ matrix.service }}
    needs: plan
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: write
    strategy:
      # One service failing must not cancel a sibling that is mid-push. The tag
      # set is a pure function of the trigger, so re-running the workflow
      # republishes the same tags and converges on a complete release; the
      # verify job below is what makes an incomplete one visible.
      fail-fast: false
      matrix:
        include:
          - service: orchestrator
            context: orchestrator
            file: orchestrator/Dockerfile
            description: Moirai orchestrator, the Python gRPC control plane.
          - service: api
            context: .
            file: api/Dockerfile
            description: Moirai API, the Go HTTP gateway in front of the control plane.
          - service: runner
            context: .
            file: runner/Dockerfile
            description: Moirai runner, the Go execution agent that runs coding agents.
          - service: web
            context: web
            file: web/Dockerfile
            description: Moirai web console, a React dashboard served by nginx.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the runtime stages of the images are emulated: the Go builders and
      # the web bundle build run on the native build platform and cross-compile.
      - uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4.2.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Expand the tag list into image references
        id: refs
        env:
          SERVICE: ${{ matrix.service }}
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -eu
          # Registry references are case sensitive and must be lowercase; the
          # repository owner is not guaranteed to be.
          image=$(printf '%s/%s' "$IMAGE_PREFIX" "$SERVICE" | tr '[:upper:]' '[:lower:]')
          {
            echo 'tags<<TAGS_EOF'
            printf '%s' "$TAGS" | tr ',' '\n' | while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              printf '%s:%s\n' "$image" "$tag"
            done
            echo 'TAGS_EOF'
            echo "image=$image"
          } >> "$GITHUB_OUTPUT"

      # The built-in GITHUB_TOKEN is the only credential involved; no
      # registry secret is provisioned for this repository.
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        if: needs.plan.outputs.push == 'true'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and publish
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.context }}
          file: ${{ matrix.file }}
          platforms: ${{ env.PLATFORMS }}
          push: ${{ needs.plan.outputs.push == 'true' }}
          # Attestations describe a published artifact, so a dry run that
          # exports nothing does not generate them.
          provenance: ${{ needs.plan.outputs.push == 'true' && 'mode=max' || 'false' }}
          sbom: ${{ needs.plan.outputs.push == 'true' }}
          tags: ${{ steps.refs.outputs.tags }}
          labels: |
            org.opencontainers.image.title=moirai-${{ matrix.service }}
            org.opencontainers.image.description=${{ matrix.description }}
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.url=${{ github.server_url }}/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            org.opencontainers.image.created=${{ needs.plan.outputs.created }}
          annotations: |
            index:org.opencontainers.image.title=moirai-${{ matrix.service }}
            index:org.opencontainers.image.description=${{ matrix.description }}
            index:org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            index:org.opencontainers.image.revision=${{ github.sha }}
            index:org.opencontainers.image.version=${{ needs.plan.outputs.version }}
            index:org.opencontainers.image.created=${{ needs.plan.outputs.created }}
          cache-from: type=gha,scope=release-${{ matrix.service }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.service }}

  verify:
    name: Verify published manifests
    needs: [plan, images]
    if: needs.plan.outputs.push == 'true'
    runs-on: [self-hosted, linux]
    permissions:
      contents: read
      packages: read
    steps:
      - uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # A multi-architecture build that silently produced one architecture still
      # pushes successfully, so the published manifest lists are inspected
      # rather than trusted.
      - name: Assert every published tag carries both architectures
        env:
          TAGS: ${{ needs.plan.outputs.tags }}
        run: |
          set -eu
          prefix=$(printf '%s' "$IMAGE_PREFIX" | tr '[:upper:]' '[:lower:]')
          references=$(mktemp)
          trap 'rm -f "$references"' EXIT
          for service in orchestrator api runner web; do
            printf '%s' "$TAGS" | tr ',' '\n' | while IFS= read -r tag; do
              [ -n "$tag" ] || continue
              printf '%s/%s:%s\n' "$prefix" "$service" "$tag"
            done
          done > "$references"

          {
            echo "### Published images"
            echo
            echo "| image | platforms |"
            echo "| --- | --- |"
          } >> "$GITHUB_STEP_SUMMARY"

          required_platforms=$(printf '%s' "$PLATFORMS" | tr ',' ' ')
          failures=0
          while IFS= read -r reference; do
            found=$(docker buildx imagetools inspect "$reference" \
              --format '{{range .Manifest.Manifests}}{{.Platform.OS}}/{{.Platform.Architecture}} {{end}}')
            missing=''
            for required in $required_platforms; do
              case " $found " in
                *" $required "*) ;;
                *) missing="$missing $required" ;;
              esac
            done
            if [ -n "$missing" ]; then
              echo "::error::$reference is missing:$missing (found: $found)"
              failures=$((failures + 1))
              echo "| \`$reference\` | **missing:$missing** |" >> "$GITHUB_STEP_SUMMARY"
            else
              echo "ok $reference -> $found"
              echo "| \`$reference\` | $found |" >> "$GITHUB_STEP_SUMMARY"
            fi
          done < "$references"
          [ "$failures" -eq 0 ] || exit 1
