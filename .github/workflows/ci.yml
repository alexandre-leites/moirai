name: CI

# Runner pool: this repository's jobs normally target a self-hosted pool. Those
# declarations are commented out below rather than deleted, next to the
# GitHub-hosted `ubuntu-latest` line that replaces each one, so the switch back
# is a one-line edit per job.
#
# Why: no self-hosted runner was picking jobs up, so every CI run on main queued
# until the next push cancelled it via `cancel-in-progress` -- eleven consecutive
# cancelled runs, and nothing merged in that window was verified. Switched to
# hosted runners on 2026-08-01 (fresh monthly Actions allowance).

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"
  UV_VERSION: "0.11.33"

jobs:
  test-orchestrator:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
      - name: Provision Python ${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail
          uv python install "$PYTHON_VERSION"
          # --system excludes virtualenvs from the lookup. A leftover .venv in the
          # workspace is itself built from the managed interpreter, so it would
          # otherwise win and put .venv/bin -- ruff, mypy and pytest shims -- on
          # PATH ahead of everything. Assigning before dirname matters too:
          # `dirname "$(uv python find ...)"` reports "." and exits 0 when the
          # lookup fails, which would silently prepend the repo root to PATH.
          interpreter="$(uv python find --system --managed-python "$PYTHON_VERSION")"
          test -x "$interpreter"
          "$interpreter" --version
          dirname "$interpreter" >> "$GITHUB_PATH"
      - run: make test-orchestrator

  test-postgres-integration:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    env:
      LOOP_TEST_DATABASE_URL: postgresql://loop:loop-test-password@localhost:5432/loop_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loop_test
          POSTGRES_USER: loop
          POSTGRES_PASSWORD: loop-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loop -d loop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
      - name: Provision Python ${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail
          uv python install "$PYTHON_VERSION"
          # --system excludes virtualenvs from the lookup. A leftover .venv in the
          # workspace is itself built from the managed interpreter, so it would
          # otherwise win and put .venv/bin -- ruff, mypy and pytest shims -- on
          # PATH ahead of everything. Assigning before dirname matters too:
          # `dirname "$(uv python find ...)"` reports "." and exits 0 when the
          # lookup fails, which would silently prepend the repo root to PATH.
          interpreter="$(uv python find --system --managed-python "$PYTHON_VERSION")"
          test -x "$interpreter"
          "$interpreter" --version
          dirname "$interpreter" >> "$GITHUB_PATH"
      - run: make test-postgres-integration

  lint:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
      - name: Provision Python ${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail
          uv python install "$PYTHON_VERSION"
          # --system excludes virtualenvs from the lookup. A leftover .venv in the
          # workspace is itself built from the managed interpreter, so it would
          # otherwise win and put .venv/bin -- ruff, mypy and pytest shims -- on
          # PATH ahead of everything. Assigning before dirname matters too:
          # `dirname "$(uv python find ...)"` reports "." and exits 0 when the
          # lookup fails, which would silently prepend the repo root to PATH.
          interpreter="$(uv python find --system --managed-python "$PYTHON_VERSION")"
          test -x "$interpreter"
          "$interpreter" --version
          dirname "$interpreter" >> "$GITHUB_PATH"
      - run: make lint

  typecheck:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
      - name: Provision Python ${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail
          uv python install "$PYTHON_VERSION"
          # --system excludes virtualenvs from the lookup. A leftover .venv in the
          # workspace is itself built from the managed interpreter, so it would
          # otherwise win and put .venv/bin -- ruff, mypy and pytest shims -- on
          # PATH ahead of everything. Assigning before dirname matters too:
          # `dirname "$(uv python find ...)"` reports "." and exits 0 when the
          # lookup fails, which would silently prepend the repo root to PATH.
          interpreter="$(uv python find --system --managed-python "$PYTHON_VERSION")"
          test -x "$interpreter"
          "$interpreter" --version
          dirname "$interpreter" >> "$GITHUB_PATH"
      - run: make typecheck

  runner:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
          cache-dependency-path: runner/go.sum
      - run: cd runner && go test -race ./...
      - run: cd runner && go vet ./...

  api:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
          cache-dependency-path: api/go.sum
      - run: cd api && go test -race ./...
      - run: cd api && go vet ./...

  # Own job rather than a step of build-web, so a failing vitest suite or an
  # eslint error is reported as itself instead of as "the web build broke", and
  # so the two can run concurrently when the self-hosted pool has the capacity.
  # `make test-web` is `cd web && npm ci && npm run typecheck && npm run lint &&
  # npm test`: any one of those exiting non-zero fails the chain, and therefore
  # this job. Note `npm run lint` is `eslint .` with no `--max-warnings`, so it
  # gates eslint *errors* only; the ten warnings in the quality backlog do not
  # fail this job today.
  test-web:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make test-web

  build-web:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build-web

  compose-smoke:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create Compose secrets
        run: |
          mkdir secrets
          printf '%s\n' 'postgres-password' > secrets/postgres_password
          printf '%s\n' 'postgresql+asyncpg://loop:postgres-password@postgres:5432/loop' > secrets/database_url
          # Must satisfy the bootstrap password policy (8+ chars with a digit,
          # upper, lower and symbol) or the orchestrator refuses to start and
          # this job fails on an unhealthy container rather than a real defect.
          printf '%s\n' 'Smoke-Test-Password-1' > secrets/initial_admin_password
          printf '%s\n' 'github-token' > secrets/github_token
          printf '%s\n' 'runner-registration-token' > secrets/runner_registration_token
          chmod 0400 secrets/*
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify readiness endpoints
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://localhost:3000/
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://localhost:8080/ready
      - name: Collect diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  vulnerability-scan:
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd api && govulncheck ./...
          cd ../runner && govulncheck ./...
      - uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9
        with:
          version: ${{ env.UV_VERSION }}
      - name: Provision Python ${{ env.PYTHON_VERSION }}
        run: |
          set -euo pipefail
          uv python install "$PYTHON_VERSION"
          # --system excludes virtualenvs from the lookup. A leftover .venv in the
          # workspace is itself built from the managed interpreter, so it would
          # otherwise win and put .venv/bin -- ruff, mypy and pytest shims -- on
          # PATH ahead of everything. Assigning before dirname matters too:
          # `dirname "$(uv python find ...)"` reports "." and exits 0 when the
          # lookup fails, which would silently prepend the repo root to PATH.
          interpreter="$(uv python find --system --managed-python "$PYTHON_VERSION")"
          test -x "$interpreter"
          "$interpreter" --version
          dirname "$interpreter" >> "$GITHUB_PATH"
      - name: Scan Python lockfile dependencies
        run: |
          python3 - <<'PY' > .audit-requirements.txt
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("orchestrator/uv.lock").read_text())
          for package in sorted(lock["package"], key=lambda package: package["name"]):
              if "registry" in package.get("source", {}):
                  print(f'{package["name"]}=={package["version"]}')
          PY
          uv tool run pip-audit --requirement .audit-requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan Node dependencies
        run: cd web && npm ci && npm audit --audit-level=high
      - name: Scan filesystem, secrets, and container configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

  validate:
    needs: [test-orchestrator, lint, typecheck, runner, api, test-web, build-web, compose-smoke, vulnerability-scan]
    # runs-on: [self-hosted, linux]
    runs-on: ubuntu-latest
    steps:
      - run: true
