name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  test-orchestrator:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make test-orchestrator

  test-postgres-integration:
    runs-on: [self-hosted, linux]
    env:
      LOOP_TEST_DATABASE_URL: postgresql://loop:loop-test-password@localhost:5432/loop_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loop_test
          POSTGRES_USER: loop
          POSTGRES_PASSWORD: loop-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loop -d loop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make test-postgres-integration

  lint:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make lint

  typecheck:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make typecheck

  runner:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
          cache-dependency-path: runner/go.sum
      - run: cd runner && go test -race ./...
      - run: cd runner && go vet ./...

  api:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
          cache-dependency-path: api/go.sum
      - run: cd api && go test -race ./...
      - run: cd api && go vet ./...

  build-web:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make test-web
      - run: make build-web

  compose-smoke:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Create Compose secrets
        run: |
          mkdir secrets
          printf '%s\n' 'postgres-password' > secrets/postgres_password
          printf '%s\n' 'postgresql+asyncpg://loop:postgres-password@postgres:5432/loop' > secrets/database_url
          printf '%s\n' 'admin-password' > secrets/initial_admin_password
          printf '%s\n' 'github-token' > secrets/github_token
          printf '%s\n' 'runner-registration-token' > secrets/runner_registration_token
          chmod 0400 secrets/*
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify readiness endpoints
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://localhost:3000/
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://localhost:8080/ready
      - name: Collect diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  vulnerability-scan:
    runs-on: [self-hosted, linux]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        with:
          go-version: "1.25.12"
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd api && govulncheck ./...
          cd ../runner && govulncheck ./...
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan Python lockfile dependencies
        run: |
          python3 -m pip install pip-audit
          python3 - <<'PY' > .audit-requirements.txt
          import tomllib
          from pathlib import Path

          lock = tomllib.loads(Path("orchestrator/uv.lock").read_text())
          for package in sorted(lock["package"], key=lambda package: package["name"]):
              if "registry" in package.get("source", {}):
                  print(f'{package["name"]}=={package["version"]}')
          PY
          pip-audit --requirement .audit-requirements.txt
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan Node dependencies
        run: cd web && npm ci && npm audit --audit-level=high
      - name: Scan filesystem, secrets, and container configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: secret
          exit-code: "1"

  validate:
    needs: [test-orchestrator, lint, typecheck, runner, api, build-web, compose-smoke, vulnerability-scan]
    runs-on: [self-hosted, linux]
    steps:
      - run: true
