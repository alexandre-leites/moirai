name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  test-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make test-orchestrator

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make typecheck

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.12"
          cache-dependency-path: runner/go.sum
      - run: cd runner && go test -race ./...
      - run: cd runner && go vet ./...

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.12"
          cache-dependency-path: api/go.sum
      - run: cd api && go test -race ./...
      - run: cd api && go vet ./...

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build-web

  compose-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Create Compose secrets
        run: |
          mkdir secrets
          printf '%s\n' 'postgres-password' > secrets/postgres_password
          printf '%s\n' 'postgresql+asyncpg://loop:postgres-password@postgres:5432/loop' > secrets/database_url
          printf '%s\n' 'admin-password' > secrets/initial_admin_password
          printf '%s\n' 'github-token' > secrets/github_token
          printf '%s\n' 'runner-registration-token' > secrets/runner_registration_token
          chmod 0644 secrets/*
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - name: Build and start stack
        run: docker compose up --build --detach --wait --wait-timeout 180
      - name: Verify readiness endpoints
        run: |
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://localhost:3000/
          curl --fail --retry 12 --retry-all-errors --retry-delay 2 http://localhost:8080/ready
      - name: Collect diagnostics
        if: always()
        run: docker compose ps && docker compose logs --no-color
      - name: Tear down stack
        if: always()
        run: docker compose down --volumes --remove-orphans

  vulnerability-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff
        with:
          go-version: "1.25.12"
      - name: Scan Go dependencies
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          cd api && govulncheck ./...
          cd ../runner && govulncheck ./...
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Scan Python dependencies
        run: |
          python3 -m venv .audit-venv
          .audit-venv/bin/pip install -e ./orchestrator pip-audit
          .audit-venv/bin/pip-audit --local --skip-editable
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Scan Node dependencies
        run: cd web && npm ci && npm audit
      - name: Scan filesystem, secrets, and container configuration
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25
        with:
          scan-type: fs
          scan-ref: .
          scanners: vuln,secret,config
          exit-code: "1"

  validate:
    needs: [test-orchestrator, lint, typecheck, runner, api, build-web, compose-smoke, vulnerability-scan]
    runs-on: ubuntu-latest
    steps:
      - run: true
