name: CI

on:
  push:
    branches: [main]
  pull_request:

env:
  PYTHON_VERSION: "3.12"
  NODE_VERSION: "22"

jobs:
  test-orchestrator:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make test-orchestrator

  test-postgres-integration:
    runs-on: ubuntu-latest
    env:
      LOOP_TEST_DATABASE_URL: postgresql://loop:loop-test-password@localhost:5432/loop_test
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: loop_test
          POSTGRES_USER: loop
          POSTGRES_PASSWORD: loop-test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U loop -d loop_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make test-postgres-integration

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make lint

  typecheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make typecheck

  runner:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: runner/go.mod
          cache-dependency-path: runner/go.sum
      - run: cd runner && go test -race ./...
      - run: cd runner && go vet ./...

  api:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: api/go.mod
          cache-dependency-path: api/go.sum
      - run: cd api && go test ./...
      - run: cd api && go vet ./...

  build-web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: make build-web

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: make compose

  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - name: Install orchestrator with dev extras
        run: python3 -m pip install -e "./orchestrator[dev]"
      - run: make validate
