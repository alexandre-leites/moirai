name: Bug report
description: Report a defect in Moirai
title: "bug: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug. Please fill in as much detail as you can — it makes triage much faster.
  - type: dropdown
    id: component
    attributes:
      label: Affected component
      description: Which part of the system is affected?
      options:
        - orchestrator
        - api
        - runner
        - web
        - proto / gen
        - docs
        - other / not sure
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: A clear description of the bug and, if relevant, what you expected instead.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: Exact steps, commands, or configuration that trigger the bug.
      placeholder: |
        1. ...
        2. ...
        3. ...
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or output
      description: Paste any relevant logs, error messages, or stack traces. This will be rendered as code automatically, no need for backticks.
      render: shell
  - type: input
    id: version
    attributes:
      label: Version / commit
      description: Image tag (e.g. `0.2.0`) or commit SHA you are running.
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Docker Compose overlays in use, OS, or anything else relevant to reproducing this.
  - type: checkboxes
    id: checks
    attributes:
      label: Checklist
      options:
        - label: I searched existing issues and did not find a duplicate.
          required: true
