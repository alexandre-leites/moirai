syntax = "proto3";
package loop.runner.v1;
option go_package = "github.com/loop-engineering/contracts/gen/runner/v1;runnerv1";

service RunnerControl {
  rpc RegisterRunner(RegisterRunnerRequest) returns (RegisterRunnerResponse);
  rpc Connect(stream RunnerToOrchestrator) returns (stream OrchestratorToRunner);
  // Hands a runner one secret for a job it currently holds, so the credential
  // does not have to be provisioned on the runner host. Unary rather than a
  // message on the Connect stream: it needs no correlation machinery, and a
  // refusal is an ordinary status the caller can act on.
  //
  // The orchestrator refuses to answer this over an insecure channel, so a
  // deployment without TLS keeps working exactly as before -- the runner
  // resolves from its own environment -- and simply has no per-project
  // credentials.
  rpc ResolveJobSecret(ResolveJobSecretRequest) returns (ResolveJobSecretResponse);

  // Persists a credential the agent harness rotated while running the job.
  //
  // A subscription credential is an access token that expires, and the harness
  // refreshes it inside the execution. Without somewhere durable to put the new
  // value, every execution redoes the authorization dance or starts failing.
  // Fenced exactly like ResolveJobSecret, and an update only: a runner may
  // replace a credential the project already gave it and nothing else.
  rpc StoreJobSecret(StoreJobSecretRequest) returns (StoreJobSecretResponse);
}

message RegisterRunnerRequest { string token = 1; string name = 2; repeated string labels = 3; string protocol_version = 4; int32 capacity = 5; }
message RegisterRunnerResponse { string runner_id = 1; string credential = 2; }
message RunnerToOrchestrator {
  string runner_id = 1;
  string credential = 2;
  oneof message {
    Heartbeat heartbeat = 3;
    ExecutionEvent event = 4;
    JobOfferAccepted offer_accepted = 5;
    JobOfferRejected offer_rejected = 6;
    LeaseRenewal lease_renewal = 7;
    RunnerDraining runner_draining = 8;
  }
}
message OrchestratorToRunner {
  oneof message {
    JobOffer offer = 1;
    CancelExecution cancel = 2;
    LeaseAcknowledged lease_acknowledged = 3;
    DrainRunner drain = 4;
  }
}
message Heartbeat { repeated string labels = 1; bool busy = 2; string version = 3; }
message JobOffer { string job_id = 1; int64 lease_generation = 2; string task_packet_json = 3; }
message JobOfferAccepted { string job_id = 1; }
message JobOfferRejected { string job_id = 1; string reason = 2; }
message LeaseRenewal { string job_id = 1; int64 lease_generation = 2; int64 requested_expires_at_unix_ms = 3; }
message LeaseAcknowledged { string job_id = 1; int64 lease_generation = 2; int64 expires_at_unix_ms = 3; }
message CancelExecution { string execution_id = 1; int64 lease_generation = 2; }
message DrainRunner { bool undrain = 1; }
message RunnerDraining { bool draining = 1; }
message ExecutionEvent { string job_id = 1; string execution_id = 2; int64 lease_generation = 3; int64 event_sequence = 4; string type = 5; string payload_json = 6; }

message ResolveJobSecretRequest {
  string runner_id = 1;
  string credential = 2;
  // The job whose project owns the secret. The runner must hold this job at
  // this generation right now, so a runner whose lease was taken away cannot
  // keep resolving secrets for work it no longer owns.
  string job_id = 3;
  int64 lease_generation = 4;
  // The task packet's EnvironmentRef name, e.g. "GITHUB_TOKEN". This is what
  // finally gives EnvironmentRef.secret_ref a backend to select.
  string name = 5;
}
message ResolveJobSecretResponse {
  string value = 1;
  // Where the value has to land. "environment" is a variable the agent and git
  // see; "file" means the runner writes it to a private path and passes that
  // path instead, which is what an SSH key needs.
  string delivery = 2;
}

message StoreJobSecretRequest {
  string runner_id = 1;
  string credential = 2;
  string job_id = 3;
  int64 lease_generation = 4;
  // The task packet's EnvironmentRef name. Only an agent credential can be
  // rotated; the git kinds are not the runner's to rewrite.
  string name = 5;
  string value = 6;
}
message StoreJobSecretResponse {
  // False means the project has no credential of that name to rotate. The
  // runner reports it and carries on rather than failing the execution: the
  // value it holds is still the working one for this run.
  bool stored = 1;
}
