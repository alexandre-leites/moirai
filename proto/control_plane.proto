syntax = "proto3";
package loop.control.v1;
option go_package = "github.com/alexandre-leites/moirai/contracts/gen/control/v1;controlv1";

service ControlPlane {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc SetProjectEnabled(SetProjectEnabledRequest) returns (SetProjectEnabledResponse);
  rpc SetProjectCredential(SetProjectCredentialRequest) returns (SetProjectCredentialResponse);
  rpc ClearProjectCredential(ClearProjectCredentialRequest) returns (ClearProjectCredentialResponse);
  rpc ListProjectCredentials(ListProjectCredentialsRequest) returns (ListProjectCredentialsResponse);
  // ListTaskSourceTypes is the discovery RPC #294 introduces: every
  // TaskSourceType this orchestrator has a descriptor for, field by field.
  // It is what lets the console render a create/edit form generically
  // instead of hardcoding one per provider.
  rpc ListTaskSourceTypes(ListTaskSourceTypesRequest) returns (ListTaskSourceTypesResponse);
  rpc CreateTaskSource(CreateTaskSourceRequest) returns (CreateTaskSourceResponse);
  rpc UpdateTaskSource(UpdateTaskSourceRequest) returns (UpdateTaskSourceResponse);
  rpc DeleteTaskSource(DeleteTaskSourceRequest) returns (DeleteTaskSourceResponse);
  rpc CreateRunnerRegistrationToken(CreateRunnerRegistrationTokenRequest) returns (CreateRunnerRegistrationTokenResponse);
  rpc ListRunnerRegistrationTokens(ListRunnerRegistrationTokensRequest) returns (ListRunnerRegistrationTokensResponse);
  rpc RevokeRunnerRegistrationToken(RevokeRunnerRegistrationTokenRequest) returns (RevokeRunnerRegistrationTokenResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  rpc ListWorkflowEvents(ListWorkflowEventsRequest) returns (ListWorkflowEventsResponse);
  rpc ListRunners(ListRunnersRequest) returns (ListRunnersResponse);
  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse);
  rpc SyncNow(SyncNowRequest) returns (SyncNowResponse);
  rpc IssueSyncStatus(IssueSyncStatusRequest) returns (IssueSyncStatusResponse);
  rpc SetRunnerState(SetRunnerStateRequest) returns (SetRunnerStateResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc SubmitHumanDecision(SubmitHumanDecisionRequest) returns (SubmitHumanDecisionResponse);
  rpc RetryWorkflow(RetryWorkflowRequest) returns (RetryWorkflowResponse);
  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowResponse);
  rpc BlockWorkflow(BlockWorkflowRequest) returns (BlockWorkflowResponse);
  rpc GetSchedulerMetrics(GetSchedulerMetricsRequest) returns (GetSchedulerMetricsResponse);
  rpc GetSystemVersion(GetSystemVersionRequest) returns (GetSystemVersionResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream ControlPlaneEvent);
}

message LoginRequest { string username = 1; string password = 2; }
message LoginResponse { string session_token = 1; string user_id = 2; string csrf_token = 3; }
message WhoAmIRequest {}
message WhoAmIResponse { string user_id = 1; string username = 2; string role = 3; string email = 4; string display_name = 5; }
message UpdateAccountRequest {
  string current_password = 1;
  string new_password = 2;
  string new_email = 3;
  string display_name = 4;
}
message UpdateAccountResponse { string user_id = 1; string username = 2; string role = 3; string email = 4; string display_name = 5; }
message ListProjectsRequest {}
message PipelineStep {
  string command = 1;
  int32 timeout_seconds = 2;
  int32 position = 3;
  bool required = 4;
}
message Project {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  string repository_mode = 4;
  string repository_url = 5;
  string local_repository_path = 6;
  string default_branch = 7;
  repeated string required_runner_labels = 8;
  repeated PipelineStep pipeline_steps = 9;
  string execution_image = 10;
  // The wall-clock budget given to a dispatched developer execution,
  // continuations included. 0 means "unset" -- the orchestrator falls back to
  // a sane fixed default rather than sending a packet with no deadline.
  int32 execution_timeout_seconds = 11;
  // Opt-in human-approval gate (see SubmitHumanDecision): when true, a run
  // that reaches green GitHub checks stops at 'waiting_human' instead of
  // merging automatically, and only proceeds once an admin approves it.
  // Defaults to false, so an existing project's behavior is unchanged unless
  // it explicitly turns this on.
  bool require_human_approval = 12;
  // Opt-in planning gate (see #351): when true, ScheduleOnce dispatches a
  // planner-role packet before the developer packet, and its output feeds the
  // developer packet's Plan context. Defaults to false, so an existing
  // project's behavior is unchanged unless it explicitly turns this on.
  bool require_planning = 14;
  // Opt-out of the GitHub-checks gate (observeWorkflow): when false (the
  // default), a run that opened a pull request merges only once GitHub reports
  // its checks green -- a repository whose checks never report (no CI
  // configured, a token that cannot read the rollup) waits out abandonedChecks
  // and then blocks. Setting this true skips that wait for a repository where
  // checks are not meaningful: a pending or absent check rollup is treated as
  // passing, while an explicitly failing check still blocks the run.
  bool skip_checks = 15;
  // The project's configured task sources (app.project_task_sources): 0, 1 or
  // N of them, each independently enabled and provider-configured. Read-only
  // for now -- creating/editing/deleting a source needs #294's field-level
  // descriptor (which configuration fields a provider needs, and which of
  // them are secrets) for a real write API; every project has at least one
  // (auto-created from its old issue_tracker_type when this field was
  // introduced), so this is never misleadingly empty for an existing project.
  repeated TaskSource task_sources = 13;
}
// TaskSource is one configured source of work for a project (see #293):
// GitHub, Linear, Jira, a local file directory, or any future provider. A
// project may have any number of these, in any combination, including none.
message TaskSource {
  string id = 1;
  // "github", "local_file", or any other provider this orchestrator has an
  // adapter for.
  string provider = 2;
  // Operator-facing label distinguishing two sources of the same provider
  // (e.g. two GitHub repositories feeding one project).
  string name = 3;
  bool enabled = 4;
  // Non-secret provider-specific connection details (repo slug, JQL, team
  // id, local path, ...) as a JSON object, shaped by this provider's
  // TaskSourceType descriptor (see ListTaskSourceTypes). Never contains a
  // field the descriptor marks Secret -- those live only in `secrets` below,
  // as configured/not-configured, never a value.
  string configuration = 5;
  // One entry per Secret field this provider's descriptor declares, in
  // declaration order, reporting only whether a value is configured for
  // this source -- never the value itself. Mirrors ProjectCredential's own
  // convention ("what is configured, never a value") extended to
  // task-source-scoped secrets.
  repeated TaskSourceSecretField secrets = 6;
}

message TaskSourceSecretField {
  string key = 1;
  bool configured = 2;
}

// TaskSourceField is one Field a TaskSourceType declares (see descriptor.go):
// what the console needs to render an input for it, and what the server
// needs to validate a submitted value against it.
message TaskSourceField {
  string key = 1;
  string label = 2;
  string help = 3;
  // "text", "number", "bool", "enum", "string_list", or "secret".
  string kind = 4;
  bool required = 5;
  // JSON-encoded default value (e.g. `"false"`, `"\"origin\""`), empty when
  // the field has none. Always empty for a "secret" field.
  string default_value = 6;
  // Valid values for an "enum" field; empty for every other kind.
  repeated string options = 7;
  // A regexp a "text" field's value must match; empty when unconstrained.
  string pattern = 8;
}

// TaskSourceTypeDescriptor is one provider's own declaration of what it
// needs, as ListTaskSourceTypes reports it: an id (app.project_task_sources.
// provider), a display name, and its fields.
message TaskSourceTypeDescriptor {
  string id = 1;
  string display_name = 2;
  repeated TaskSourceField fields = 3;
}

message ListTaskSourceTypesRequest {}
message ListTaskSourceTypesResponse { repeated TaskSourceTypeDescriptor types = 1; }

// CreateTaskSource/UpdateTaskSource validate `configuration` and `secrets`
// against the named provider's TaskSourceTypeDescriptor server-side, using
// the same descriptor ListTaskSourceTypes exposes, so the console's
// generated form and the server's acceptance of it cannot disagree.
message CreateTaskSourceRequest {
  string project_id = 1;
  string provider = 2;
  string name = 3;
  bool enabled = 4;
  // Non-secret fields only, as a JSON object; a Secret-kind key here is
  // rejected, not silently accepted.
  string configuration = 5;
  // Secret field key -> value, write-only. Every Required secret field must
  // have an entry.
  map<string, string> secrets = 6;
}
message CreateTaskSourceResponse { TaskSource task_source = 1; }

message UpdateTaskSourceRequest {
  string task_source_id = 1;
  string name = 2;
  bool enabled = 3;
  string configuration = 4;
  // Only the secret fields present here are replaced; a field this map
  // omits keeps whatever was previously configured for it -- an edit that
  // touches only an unrelated field must never blank a configured secret.
  map<string, string> secrets = 5;
  // Secret field keys to explicitly clear, mirroring ClearProjectCredential:
  // clearing is deliberate and separate from "omitted means unchanged".
  repeated string clear_secrets = 6;
}
message UpdateTaskSourceResponse { TaskSource task_source = 1; }

message DeleteTaskSourceRequest { string task_source_id = 1; }
message DeleteTaskSourceResponse {}
message ListProjectsResponse { repeated Project projects = 1; }
message ProjectConfiguration {
  string name = 1;
  string repository_mode = 2;
  string repository_url = 3;
  string local_repository_path = 4;
  string default_branch = 5;
  repeated string required_runner_labels = 6;
  repeated PipelineStep pipeline_steps = 7;
  string execution_image = 8;
  int32 execution_timeout_seconds = 9;
  bool require_human_approval = 10;
  bool require_planning = 11;
  bool skip_checks = 12;
}
message CreateProjectRequest { ProjectConfiguration project = 1; }
message CreateProjectResponse { Project project = 1; }
message UpdateProjectRequest { string project_id = 1; ProjectConfiguration project = 2; }
message UpdateProjectResponse { Project project = 1; }
message SetProjectEnabledRequest { string project_id = 1; bool enabled = 2; }
message SetProjectEnabledResponse { Project project = 1; }

// Per-project credentials. `value` travels only on the way in; nothing ever
// returns one, which is why all three RPCs answer with the same summary
// message describing what is configured rather than what it is.
message SetProjectCredentialRequest {
  string project_id = 1;
  // "github_token", "ssh_private_key", or "agent:<NAME>" where <NAME> is the
  // environment variable an agent harness reads the credential from, e.g.
  // "agent:OPENROUTER_API_KEY".
  string kind = 2;
  string value = 3;
  // Only for an "agent:" kind, and only when the harness wants a file rather
  // than a variable: where to write it, relative to the home directory the
  // runner builds for the execution. Empty means environment delivery. This is
  // a destination, not a secret.
  string file_path = 4;
}
message ClearProjectCredentialRequest {
  string project_id = 1;
  string kind = 2;
}
message ListProjectCredentialsRequest { string project_id = 1; }
message ProjectCredential {
  string kind = 1;
  string created_at = 2;
  string updated_at = 3;
  // Empty for environment delivery. Never a value.
  string file_path = 4;
}
// One response type per RPC, each carrying the same summary: what the project
// has configured, never a value.
message SetProjectCredentialResponse { repeated ProjectCredential credentials = 1; }
message ClearProjectCredentialResponse { repeated ProjectCredential credentials = 1; }
message ListProjectCredentialsResponse { repeated ProjectCredential credentials = 1; }
message CreateRunnerRegistrationTokenRequest { repeated string allowed_labels = 1; }
message CreateRunnerRegistrationTokenResponse { string token = 1; string expires_at = 2; }
message RunnerRegistrationToken {
  string id = 1;
  repeated string allowed_labels = 2;
  string created_at = 3;
  string expires_at = 4;
  string used_at = 5;
  string revoked_at = 6;
}
message ListRunnerRegistrationTokensRequest {}
message ListRunnerRegistrationTokensResponse { repeated RunnerRegistrationToken tokens = 1; }
message RevokeRunnerRegistrationTokenRequest { string token_id = 1; }
message RevokeRunnerRegistrationTokenResponse { RunnerRegistrationToken token = 1; }
message ListWorkflowsRequest {}
message Workflow {
  string id = 1;
  string project_id = 2;
  string status = 3;
  string phase = 4;
  string issue_external_id = 5;
  string issue_title = 6;
  string branch_name = 7;
  string pull_request_external_id = 8;
  string pull_request_url = 9;
  string pull_request_state = 10;
  string blocking_reason = 11;
  int32 planning_attempts = 12;
  int32 implementation_attempts = 13;
  int32 pipeline_repair_attempts = 14;
  int32 ci_repair_attempts = 15;
  int32 review_cycles = 16;
  string created_at = 17;
  string updated_at = 18;
  // Agent executions spent across every role. This is the counter the console's
  // total-attempt meter is measured against. The Go V1 orchestrator reports the
  // column but enforces no cap on it, so the meter's budget is a display-side
  // constant (ATTEMPT_BUDGETS in web/src/status.ts) until retry policy exists.
  int32 total_agent_executions = 19;
  // The planning phase's own account of the work (#351): the planner
  // execution's summary, or empty when the project never opted into
  // RequirePlanning or the run has not reached that phase yet. Persists past
  // the developer packet it fed, so it stays visible for the life of the run.
  string plan_summary = 20;
}
message ListWorkflowsResponse { repeated Workflow workflows = 1; }
message GetWorkflowRequest { string workflow_run_id = 1; }
message GetWorkflowResponse { Workflow workflow = 1; }
message WorkflowEvent {
  string id = 1;
  string event_type = 2;
  string created_at = 3;
  string payload_json = 4;
}
message ListWorkflowEventsRequest { string workflow_run_id = 1; int64 after_id = 2; int32 limit = 3; }
message ListWorkflowEventsResponse { repeated WorkflowEvent events = 1; string next_cursor = 2; }
message ListRunnersRequest {}
message Runner { string id = 1; string name = 2; bool enabled = 3; bool draining = 4; string status = 5; repeated string labels = 6; string last_seen_at = 7; string version = 8; }
message ListRunnersResponse { repeated Runner runners = 1; }
message ListQueueRequest { int32 limit = 1; }
message QueueEntry {
  string project_id = 1;
  string project_name = 2;
  string external_id = 3;
  string title = 4;
  int32 priority = 5;
  string blocked_reason = 6;
}
message ListQueueResponse { repeated QueueEntry entries = 1; }
// SyncNow runs an issue-synchronization pass on demand. An empty project_id
// syncs every enabled project; a populated one syncs only that project and
// clears any in-memory backoff it was under.
message SyncNowRequest { string project_id = 1; }
message ProjectSyncResult {
  string project_id = 1;
  int32 synced_issues = 2;
  string error = 3;
}
message SyncNowResponse { repeated ProjectSyncResult results = 1; }
message IssueSyncStatusRequest {}
message IssueSyncStatusEntry {
  string project_id = 1;
  string project_name = 2;
  bool enabled = 3;
  int32 issue_count = 4;
  int32 eligible_count = 5;
  string last_synced_at = 6;
  int32 consecutive_failures = 7;
  string next_retry_at = 8;
  string last_error = 9;
  bool backing_off = 10;
}
message IssueSyncStatusResponse { repeated IssueSyncStatusEntry entries = 1; }
message SetRunnerStateRequest { string runner_id = 1; string state = 2; }
message SetRunnerStateResponse { Runner runner = 1; }
message LogoutRequest {}
message LogoutResponse {}
message SubmitHumanDecisionRequest { string workflow_run_id = 1; string decision = 2; string comment = 3; }
message SubmitHumanDecisionResponse { Workflow workflow = 1; }
// resume distinguishes the two retry flavours: false (the default) supersedes
// the run and lets the scheduler start a fresh one from scratch; true re-arms
// the same run's current step and re-dispatches it carrying the accumulated
// context (plan, prior failure) forward, so an agent API error does not force
// the whole workflow to start from zero.
message RetryWorkflowRequest { string workflow_run_id = 1; string reason = 2; bool resume = 3; }
message RetryWorkflowResponse { Workflow workflow = 1; }
message CancelWorkflowRequest { string workflow_run_id = 1; string reason = 2; }
message CancelWorkflowResponse { Workflow workflow = 1; }
message BlockWorkflowRequest { string workflow_run_id = 1; string reason = 2; }
message BlockWorkflowResponse { Workflow workflow = 1; }
message GetSchedulerMetricsRequest {}
// LoopStatus is one background reconciliation loop's liveness: when it last
// completed a pass without error, and the most recent error it hit (which may
// be well in the past for a loop that has since recovered). last_success_at
// and last_error_at are empty until the loop has reached that outcome at
// least once. healthy is the same threshold the process's own healthcheck
// enforces, so the console and the container orchestrator cannot disagree
// about which loop is stalled.
message LoopStatus {
  string name = 1;
  string last_success_at = 2;
  string last_error = 3;
  string last_error_at = 4;
  bool healthy = 5;
}
message GetSchedulerMetricsResponse {
  int32 queue_depth = 1;
  int32 active_workflows = 2;
  int32 scheduled_jobs = 3;
  repeated LoopStatus loop_statuses = 4;
}
message GetSystemVersionRequest {}
message GetSystemVersionResponse { string version = 1; }
message StreamEventsRequest { string last_event_id = 1; }
message ControlPlaneEvent {
  string id = 1;
  string event_type = 2;
  Workflow workflow = 3;
  Runner runner = 4;
}
