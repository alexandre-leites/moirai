syntax = "proto3";
package loop.control.v1;
option go_package = "github.com/loop-engineering/contracts/gen/control/v1;controlv1";

service ControlPlane {
  rpc Login(LoginRequest) returns (LoginResponse);
  rpc WhoAmI(WhoAmIRequest) returns (WhoAmIResponse);
  rpc UpdateAccount(UpdateAccountRequest) returns (UpdateAccountResponse);
  rpc ListProjects(ListProjectsRequest) returns (ListProjectsResponse);
  rpc CreateProject(CreateProjectRequest) returns (CreateProjectResponse);
  rpc UpdateProject(UpdateProjectRequest) returns (UpdateProjectResponse);
  rpc SetProjectEnabled(SetProjectEnabledRequest) returns (SetProjectEnabledResponse);
  rpc SetProjectCredential(SetProjectCredentialRequest) returns (SetProjectCredentialResponse);
  rpc ClearProjectCredential(ClearProjectCredentialRequest) returns (ClearProjectCredentialResponse);
  rpc ListProjectCredentials(ListProjectCredentialsRequest) returns (ListProjectCredentialsResponse);
  rpc CreateRunnerRegistrationToken(CreateRunnerRegistrationTokenRequest) returns (CreateRunnerRegistrationTokenResponse);
  rpc ListRunnerRegistrationTokens(ListRunnerRegistrationTokensRequest) returns (ListRunnerRegistrationTokensResponse);
  rpc RevokeRunnerRegistrationToken(RevokeRunnerRegistrationTokenRequest) returns (RevokeRunnerRegistrationTokenResponse);
  rpc ListWorkflows(ListWorkflowsRequest) returns (ListWorkflowsResponse);
  rpc GetWorkflow(GetWorkflowRequest) returns (GetWorkflowResponse);
  rpc ListWorkflowEvents(ListWorkflowEventsRequest) returns (ListWorkflowEventsResponse);
  rpc ListRunners(ListRunnersRequest) returns (ListRunnersResponse);
  rpc ListQueue(ListQueueRequest) returns (ListQueueResponse);
  rpc SyncNow(SyncNowRequest) returns (SyncNowResponse);
  rpc IssueSyncStatus(IssueSyncStatusRequest) returns (IssueSyncStatusResponse);
  rpc SetRunnerState(SetRunnerStateRequest) returns (SetRunnerStateResponse);
  rpc Logout(LogoutRequest) returns (LogoutResponse);
  rpc SubmitHumanDecision(SubmitHumanDecisionRequest) returns (SubmitHumanDecisionResponse);
  rpc RetryWorkflow(RetryWorkflowRequest) returns (RetryWorkflowResponse);
  rpc CancelWorkflow(CancelWorkflowRequest) returns (CancelWorkflowResponse);
  rpc BlockWorkflow(BlockWorkflowRequest) returns (BlockWorkflowResponse);
  rpc GetSchedulerMetrics(GetSchedulerMetricsRequest) returns (GetSchedulerMetricsResponse);
  rpc GetSystemVersion(GetSystemVersionRequest) returns (GetSystemVersionResponse);
  rpc StreamEvents(StreamEventsRequest) returns (stream ControlPlaneEvent);
}

message LoginRequest { string username = 1; string password = 2; }
message LoginResponse { string session_token = 1; string user_id = 2; string csrf_token = 3; }
message WhoAmIRequest {}
message WhoAmIResponse { string user_id = 1; string username = 2; string role = 3; string email = 4; string display_name = 5; }
message UpdateAccountRequest {
  string current_password = 1;
  string new_password = 2;
  string new_email = 3;
  string display_name = 4;
}
message UpdateAccountResponse { string user_id = 1; string username = 2; string role = 3; string email = 4; string display_name = 5; }
message ListProjectsRequest {}
message PipelineStep {
  string command = 1;
  int32 timeout_seconds = 2;
  int32 position = 3;
  bool required = 4;
}
message Project {
  string id = 1;
  string name = 2;
  bool enabled = 3;
  string repository_mode = 4;
  string repository_url = 5;
  string local_repository_path = 6;
  string default_branch = 7;
  repeated string required_runner_labels = 8;
  repeated PipelineStep pipeline_steps = 9;
  string execution_image = 10;
}
message ListProjectsResponse { repeated Project projects = 1; }
message ProjectConfiguration {
  string name = 1;
  string repository_mode = 2;
  string repository_url = 3;
  string local_repository_path = 4;
  string default_branch = 5;
  repeated string required_runner_labels = 6;
  repeated PipelineStep pipeline_steps = 7;
  string execution_image = 8;
}
message CreateProjectRequest { ProjectConfiguration project = 1; }
message CreateProjectResponse { Project project = 1; }
message UpdateProjectRequest { string project_id = 1; ProjectConfiguration project = 2; }
message UpdateProjectResponse { Project project = 1; }
message SetProjectEnabledRequest { string project_id = 1; bool enabled = 2; }
message SetProjectEnabledResponse { Project project = 1; }

// Per-project credentials. `value` travels only on the way in; nothing ever
// returns one, which is why all three RPCs answer with the same summary
// message describing what is configured rather than what it is.
message SetProjectCredentialRequest {
  string project_id = 1;
  // "github_token", "ssh_private_key", or "agent:<NAME>" where <NAME> is the
  // environment variable an agent harness reads the credential from, e.g.
  // "agent:OPENROUTER_API_KEY".
  string kind = 2;
  string value = 3;
  // Only for an "agent:" kind, and only when the harness wants a file rather
  // than a variable: where to write it, relative to the home directory the
  // runner builds for the execution. Empty means environment delivery. This is
  // a destination, not a secret.
  string file_path = 4;
}
message ClearProjectCredentialRequest {
  string project_id = 1;
  string kind = 2;
}
message ListProjectCredentialsRequest { string project_id = 1; }
message ProjectCredential {
  string kind = 1;
  string created_at = 2;
  string updated_at = 3;
  // Empty for environment delivery. Never a value.
  string file_path = 4;
}
// One response type per RPC, each carrying the same summary: what the project
// has configured, never a value.
message SetProjectCredentialResponse { repeated ProjectCredential credentials = 1; }
message ClearProjectCredentialResponse { repeated ProjectCredential credentials = 1; }
message ListProjectCredentialsResponse { repeated ProjectCredential credentials = 1; }
message CreateRunnerRegistrationTokenRequest { repeated string allowed_labels = 1; }
message CreateRunnerRegistrationTokenResponse { string token = 1; string expires_at = 2; }
message RunnerRegistrationToken {
  string id = 1;
  repeated string allowed_labels = 2;
  string created_at = 3;
  string expires_at = 4;
  string used_at = 5;
  string revoked_at = 6;
}
message ListRunnerRegistrationTokensRequest {}
message ListRunnerRegistrationTokensResponse { repeated RunnerRegistrationToken tokens = 1; }
message RevokeRunnerRegistrationTokenRequest { string token_id = 1; }
message RevokeRunnerRegistrationTokenResponse { RunnerRegistrationToken token = 1; }
message ListWorkflowsRequest {}
message Workflow {
  string id = 1;
  string project_id = 2;
  string status = 3;
  string phase = 4;
  string issue_external_id = 5;
  string issue_title = 6;
  string branch_name = 7;
  string pull_request_external_id = 8;
  string pull_request_url = 9;
  string pull_request_state = 10;
  string blocking_reason = 11;
  int32 planning_attempts = 12;
  int32 implementation_attempts = 13;
  int32 pipeline_repair_attempts = 14;
  int32 ci_repair_attempts = 15;
  int32 review_cycles = 16;
  string created_at = 17;
  string updated_at = 18;
  // Agent executions spent across every role. This is the counter the console's
  // total-attempt meter is measured against; its cap lives in
  // orchestrator/src/moirai/workflows/policy.py (RetryBudget).
  int32 total_agent_executions = 19;
}
message ListWorkflowsResponse { repeated Workflow workflows = 1; }
message GetWorkflowRequest { string workflow_run_id = 1; }
message GetWorkflowResponse { Workflow workflow = 1; }
message WorkflowEvent {
  string id = 1;
  string event_type = 2;
  string created_at = 3;
  string payload_json = 4;
}
message ListWorkflowEventsRequest { string workflow_run_id = 1; int64 after_id = 2; int32 limit = 3; }
message ListWorkflowEventsResponse { repeated WorkflowEvent events = 1; string next_cursor = 2; }
message ListRunnersRequest {}
message Runner { string id = 1; string name = 2; bool enabled = 3; bool draining = 4; string status = 5; repeated string labels = 6; string last_seen_at = 7; string version = 8; }
message ListRunnersResponse { repeated Runner runners = 1; }
message ListQueueRequest { int32 limit = 1; }
message QueueEntry {
  string project_id = 1;
  string project_name = 2;
  string external_id = 3;
  string title = 4;
  int32 priority = 5;
  string blocked_reason = 6;
}
message ListQueueResponse { repeated QueueEntry entries = 1; }
// SyncNow runs an issue-synchronization pass on demand. An empty project_id
// syncs every enabled project; a populated one syncs only that project and
// clears any in-memory backoff it was under.
message SyncNowRequest { string project_id = 1; }
message ProjectSyncResult {
  string project_id = 1;
  int32 synced_issues = 2;
  string error = 3;
}
message SyncNowResponse { repeated ProjectSyncResult results = 1; }
message IssueSyncStatusRequest {}
message IssueSyncStatusEntry {
  string project_id = 1;
  string project_name = 2;
  bool enabled = 3;
  int32 issue_count = 4;
  int32 eligible_count = 5;
  string last_synced_at = 6;
  int32 consecutive_failures = 7;
  string next_retry_at = 8;
  string last_error = 9;
  bool backing_off = 10;
}
message IssueSyncStatusResponse { repeated IssueSyncStatusEntry entries = 1; }
message SetRunnerStateRequest { string runner_id = 1; string state = 2; }
message SetRunnerStateResponse { Runner runner = 1; }
message LogoutRequest {}
message LogoutResponse {}
message SubmitHumanDecisionRequest { string workflow_run_id = 1; string decision = 2; string comment = 3; }
message SubmitHumanDecisionResponse { Workflow workflow = 1; }
message RetryWorkflowRequest { string workflow_run_id = 1; string reason = 2; }
message RetryWorkflowResponse { Workflow workflow = 1; }
message CancelWorkflowRequest { string workflow_run_id = 1; string reason = 2; }
message CancelWorkflowResponse { Workflow workflow = 1; }
message BlockWorkflowRequest { string workflow_run_id = 1; string reason = 2; }
message BlockWorkflowResponse { Workflow workflow = 1; }
message GetSchedulerMetricsRequest {}
message GetSchedulerMetricsResponse { int32 queue_depth = 1; int32 active_workflows = 2; int32 scheduled_jobs = 3; }
message GetSystemVersionRequest {}
message GetSystemVersionResponse { string version = 1; }
message StreamEventsRequest { string last_event_id = 1; }
message ControlPlaneEvent {
  string id = 1;
  string event_type = 2;
  Workflow workflow = 3;
  Runner runner = 4;
}
