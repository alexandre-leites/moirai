[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "loop-engineering-orchestrator"
version = "0.1.0"
description = "Durable control plane for Moirai"
requires-python = ">=3.12"
dependencies = [
  "asyncpg>=0.29",
  "grpcio>=1.64",
  "protobuf>=7.35,<8",
  "langgraph>=0.2",
  "langgraph-checkpoint-postgres>=2.0",
  "psycopg[binary]>=3.2",
  "prometheus-client>=0.21,<1",
]

[project.optional-dependencies]
# ruff and mypy are capped: CI gates on them, and an unpinned linter/type
# checker turns any upstream release (new default rules, stricter inference)
# into a red build on an unrelated commit. Raise the caps deliberately.
dev = ["pytest>=8.2", "ruff>=0.5,<0.17", "mypy>=1.10,<2.4", "types-grpcio>=1.0", "types-protobuf>=5.27", "asyncpg-stubs>=0.29"]

[tool.setuptools.package-data]
"moirai.workflows" = ["schemas/*.schema.json"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"
# Generated protobuf/grpc code -- not hand-maintained, not worth linting.
extend-exclude = ["src/moirai/protocols/proto", "src/proto"]

[tool.ruff.lint]
ignore = [
    # `async with pool.acquire() as connection:` / `async with connection.transaction():`
    # is the deliberate acquire-then-transaction pairing used throughout the
    # persistence layer. Collapsing the two dedents each block body, which
    # rewrites the embedded SQL heredocs purely for style; ruff itself offers
    # no safe autofix for these sites.
    "SIM117",
"EXE002",
    "E402",
]

[tool.mypy]
python_version = "3.12"
strict = true
packages = ["moirai"]
