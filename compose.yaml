services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: loop
      POSTGRES_USER: loop
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    environment:
      LOOP_DATABASE_URL_FILE: /run/secrets/database_url
      LOOP_GRPC_BIND: 0.0.0.0:50051
      LOOP_INITIAL_ADMIN_USERNAME: "${LOOP_INITIAL_ADMIN_USERNAME:-admin}"
      LOOP_INITIAL_ADMIN_PASSWORD: "${LOOP_INITIAL_ADMIN_PASSWORD}"
      LOOP_SEED_PROJECT_NAME: "${LOOP_SEED_PROJECT_NAME:-demo}"
      LOOP_SEED_PROJECT_REPOSITORY_URL: "${LOOP_SEED_PROJECT_REPOSITORY_URL}"
      LOOP_SEED_TOKEN_LABELS: "${LOOP_SEED_TOKEN_LABELS:-linux}"
      LOOP_SEED_ISSUE_TITLE: "${LOOP_SEED_ISSUE_TITLE:-}"
      LOOP_SEED_ISSUE_BODY: "${LOOP_SEED_ISSUE_BODY:-}"
    secrets: [database_url]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database, control]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import socket; s=socket.create_connection(('localhost',50051)); s.close()\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      LOOP_ORCHESTRATOR_ENDPOINT: orchestrator:50051
    depends_on:
      orchestrator: {condition: service_healthy}
    networks: [control, public]
    ports: ["8080:8080"]
    healthcheck:
      test: ["CMD-SHELL", "pidof api >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build: ./web
    depends_on:
      api: {condition: service_healthy}
    networks: [public]
    ports: ["3000:80"]
    healthcheck:
      test: ["CMD-SHELL", "pidof nginx >/dev/null 2>&1 || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    environment:
      LOOP_ORCHESTRATOR_ENDPOINT: orchestrator:50051
      LOOP_RUNNER_REGISTRATION_TOKEN: "${RUNNER_REGISTRATION_TOKEN}"
      LOOP_RUNNER_NAME: "${LOOP_RUNNER_NAME:-runner-1}"
      LOOP_RUNNER_LABELS: "${LOOP_RUNNER_LABELS:-linux}"
      LOOP_RUNNER_AGENT_ARGUMENTS: "--model,opencode/deepseek-v4-flash-free,--auto"
    depends_on:
      orchestrator: {condition: service_healthy}
    networks: [control, public]
    volumes: [runner-data:/data]

networks:
  database: {internal: true}
  control: {internal: true}
  public: {}

volumes:
  postgres-data: {}
  runner-data: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
