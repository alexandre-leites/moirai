services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loop
      POSTGRES_USER: loop
      POSTGRES_PASSWORD_FILE: /run/secrets/postgres_password
    secrets: [postgres_password]
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  orchestrator:
    build:
      context: ./orchestrator
      dockerfile: Dockerfile
    restart: unless-stopped
    environment:
      LOOP_DATABASE_URL_FILE: /run/secrets/database_url
      LOOP_GRPC_BIND: 0.0.0.0:50051
      LOOP_INITIAL_ADMIN_USERNAME: "${LOOP_INITIAL_ADMIN_USERNAME:-admin}"
      LOOP_INITIAL_ADMIN_PASSWORD_FILE: /run/secrets/initial_admin_password
      LOOP_GITHUB_TOKEN_FILE: /run/secrets/github_token
      RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/runner_registration_token
      LOOP_SEED_PROJECT_NAME: "${LOOP_SEED_PROJECT_NAME:-demo}"
      LOOP_SEED_PROJECT_REPOSITORY_URL: "${LOOP_SEED_PROJECT_REPOSITORY_URL}"
      LOOP_SEED_TOKEN_LABELS: "${LOOP_SEED_TOKEN_LABELS:-linux}"
      LOOP_SEED_ISSUE_TITLE: "${LOOP_SEED_ISSUE_TITLE:-}"
      LOOP_SEED_ISSUE_BODY: "${LOOP_SEED_ISSUE_BODY:-}"
    secrets: [database_url, initial_admin_password, github_token, runner_registration_token]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database, control]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,sys,time; d=json.load(open('/tmp/loop-orchestrator-health.json')); sys.exit(0 if d.get('db_ok') and time.time()-d.get('updated_at',0)<45 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    restart: unless-stopped
    environment:
      LOOP_ORCHESTRATOR_ENDPOINT: orchestrator:50051
    depends_on:
      orchestrator: {condition: service_healthy}
    networks: [control, public]
    ports: ["127.0.0.1:8080:8080"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    build: ./web
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    networks: [public]
    ports: ["3000:8080"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  runner:
    build:
      context: .
      dockerfile: runner/Dockerfile
    restart: unless-stopped
    environment:
      LOOP_ORCHESTRATOR_ENDPOINT: orchestrator:50051
      LOOP_RUNNER_REGISTRATION_TOKEN_FILE: /run/secrets/runner_registration_token
      LOOP_RUNNER_NAME: "${LOOP_RUNNER_NAME:-runner-1}"
      LOOP_RUNNER_LABELS: "${LOOP_RUNNER_LABELS:-linux}"
      LOOP_RUNNER_CAPACITY: "${LOOP_RUNNER_CAPACITY:-1}"
      LOOP_RUNNER_AGENT_ARGUMENTS: "--model,opencode/deepseek-v4-flash-free,--auto"
    secrets: [runner_registration_token]
    read_only: true
    tmpfs:
      - /run:mode=0755
    depends_on:
      orchestrator: {condition: service_healthy}
    networks: [control, public]
    volumes: [runner-data:/data]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    healthcheck:
      test: ["CMD", "/runner", "live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "2"
          memory: 4g

networks:
  database: {internal: true}
  control: {internal: true}
  public: {}

volumes:
  postgres-data: {}
  runner-data: {}

secrets:
  postgres_password:
    file: ./secrets/postgres_password
  database_url:
    file: ./secrets/database_url
  initial_admin_password:
    file: ./secrets/initial_admin_password
  github_token:
    file: ./secrets/github_token
  runner_registration_token:
    file: ./secrets/runner_registration_token
