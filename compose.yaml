# Moirai — the whole stack, ready to run.
#
#   docker compose up -d
#
# Nothing has to be prepared: every setting has a working default, so this comes
# up on a clean machine with no .env, no secrets directory, and no build step.
# Copy .env.example to .env when you want to change something.
#
# In Portainer: Stacks -> Add stack -> Web editor, paste this file, and put any
# overrides under "Environment variables". The images come from GHCR, so the
# Docker host needs credentials for ghcr.io while this repository is private
# (Registries -> Add registry -> Custom).
#
# Three optional overlays, which combine:
#
#   -f compose.yaml -f compose.build.yaml    build the images from this checkout
#   -f compose.yaml -f compose.secrets.yaml  read secrets from ./secrets/ files
#   -f compose.yaml -f compose.tls.yaml      encrypt the orchestrator's control
#                                            stream, which is what lets a runner
#                                            be handed a project's own credential
#                                            instead of using the shared
#                                            GITHUB_TOKEN below
#
# ---------------------------------------------------------------------------
# The defaults below are public knowledge, and the console is served over plain
# HTTP. That is fine on a private host and nowhere else: change
# MOIRAI_ADMIN_PASSWORD and MOIRAI_POSTGRES_PASSWORD if anyone else can reach
# it, and put it behind TLS before exposing it. compose.secrets.yaml moves every
# secret out of the environment and into files.
#
# compose.tls.yaml encrypts the *internal* control stream between services. It
# is not a substitute for putting the console behind TLS, and neither is a
# substitute for the other.
# ---------------------------------------------------------------------------

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loop
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: "${MOIRAI_POSTGRES_PASSWORD:-moirai-local-postgres}"
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    # Everything downstream waits on this, so it is what makes the start order
    # hold: the orchestrator never runs a migration against a database that is
    # still initialising.
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

  orchestrator:
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/orchestrator:${MOIRAI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LOOP_GRPC_BIND: 0.0.0.0:50051
      # The entrypoint writes each secret into a tmpfs file the unprivileged
      # user can read and unsets the variable, so none reaches the server
      # process. They are still visible to `docker inspect`; compose.secrets.yaml
      # is the overlay that avoids that.
      LOOP_DATABASE_URL: "postgresql+asyncpg://loop:${MOIRAI_POSTGRES_PASSWORD:-moirai-local-postgres}@postgres:5432/loop"
      LOOP_INITIAL_ADMIN_USERNAME: "${MOIRAI_ADMIN_USERNAME:-admin}"
      # At least 8 characters with a digit, a capital, a lowercase and a symbol.
      # A password that fails the policy stops the orchestrator from starting,
      # which Compose can only report as an unhealthy container.
      LOOP_INITIAL_ADMIN_PASSWORD: "${MOIRAI_ADMIN_PASSWORD:-Moirai-Local-1}"
      RUNNER_REGISTRATION_TOKEN: "${MOIRAI_RUNNER_TOKEN:-moirai-local-runner-registration-token}"
      # Optional. Without it the stack runs and the console works, but Moirai
      # cannot read issues, clone, push or open pull requests. A project that
      # configures its own credential in the console does not use this one.
      LOOP_GITHUB_TOKEN: "${MOIRAI_GITHUB_TOKEN-}"
      # Encrypts per-project credentials at rest. Deliberately has no default:
      # a key committed here would be public, and encrypting with it would be
      # theatre. Without one the stack runs normally and only per-project
      # credentials are refused, with a message naming this variable.
      # Back it up -- lose it and every stored credential is unreadable.
      LOOP_SECRET_KEY: "${MOIRAI_SECRET_KEY-}"
      # Seed project created on a fresh database. Set MOIRAI_SEED_PROJECT_NAME
      # to an empty string to turn seeding off.
      LOOP_SEED_PROJECT_NAME: "${MOIRAI_SEED_PROJECT_NAME-demo}"
      LOOP_SEED_PROJECT_REPOSITORY_URL: "${MOIRAI_SEED_PROJECT_REPOSITORY_URL-}"
      LOOP_SEED_TOKEN_LABELS: "${MOIRAI_RUNNER_LABELS:-linux}"
      LOOP_SEED_ISSUE_TITLE: "${MOIRAI_SEED_ISSUE_TITLE-}"
      LOOP_SEED_ISSUE_BODY: "${MOIRAI_SEED_ISSUE_BODY-}"
      # Provider credentials every task packet asks the runner for. Names only,
      # never values -- this is what makes the packet *request* a key, which is
      # the layer a paid model was missing. Comma separated; `NAME=path`
      # delivers it as a file below the agent's home directory instead of as a
      # variable, which is what a subscription harness wants.
      #
      #   MOIRAI_AGENT_CREDENTIAL_REFS=OPENROUTER_API_KEY
      #   MOIRAI_AGENT_CREDENTIAL_REFS=OPENCODE_AUTH=.local/share/opencode/auth.json
      #
      # The value comes from the runner's own environment under the same name,
      # or from the project's own credential -- which needs compose.tls.yaml,
      # because the orchestrator will not send one in the clear.
      LOOP_AGENT_CREDENTIAL_REFS: "${MOIRAI_AGENT_CREDENTIAL_REFS-}"
    depends_on:
      postgres: {condition: service_healthy}
    # `egress` is not optional: issue sync, pull requests, check polling and
    # merges all call api.github.com from here. Without it every project reports
    # "error connecting to api.github.com" and retries forever.
    networks: [database, control, egress]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    # Reports healthy only once the database is reachable and migrations have
    # run, which is what the api and runner below actually need.
    healthcheck:
      test: ["CMD", "/app/orchestrator", "healthcheck"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 60s

  api:
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/api:${MOIRAI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LOOP_ORCHESTRATOR_ENDPOINT: orchestrator:50051
      # The console is plain HTTP here, so the session cookie cannot carry
      # Secure or the browser refuses to store it. Set this to "true" once the
      # stack is behind TLS.
      LOOP_API_COOKIE_SECURE: "${MOIRAI_COOKIE_SECURE:-false}"
    depends_on:
      orchestrator: {condition: service_healthy}
    networks: [control, public]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ready || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 20s

  web:
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/web:${MOIRAI_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    networks: [public]
    # The only published port. nginx proxies /api/ to the api service over an
    # internal network, so nothing else needs exposing -- which is what lets
    # this work unchanged against a remote Portainer host.
    ports: ["${MOIRAI_WEB_PORT:-3000}:8080"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s

  runner:
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/runner:${MOIRAI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LOOP_ORCHESTRATOR_ENDPOINT: orchestrator:50051
      # Written to tmpfs and unset by the entrypoint before the runner starts,
      # so it never reaches the runner process, let alone an agent it spawns.
      # Must match the orchestrator's RUNNER_REGISTRATION_TOKEN above.
      LOOP_RUNNER_REGISTRATION_TOKEN: "${MOIRAI_RUNNER_TOKEN:-moirai-local-runner-registration-token}"
      LOOP_RUNNER_NAME: "${MOIRAI_RUNNER_NAME:-runner-1}"
      LOOP_RUNNER_LABELS: "${MOIRAI_RUNNER_LABELS:-linux}"
      LOOP_RUNNER_CAPACITY: "${MOIRAI_RUNNER_CAPACITY:-1}"
      # Which task-packet environment requests the runner will honour. One of
      # these is required for a managed clone and for anything that pushes:
      # GITHUB_TOKEN for an https remote, GIT_SSH_KEY for an ssh one.
      LOOP_RUNNER_ALLOWED_ENVIRONMENT: "GITHUB_TOKEN,GIT_SSH_KEY${MOIRAI_AGENT_CREDENTIAL_NAMES:+,${MOIRAI_AGENT_CREDENTIAL_NAMES}}"
      # Only used for projects with no credential of their own. A runner whose
      # projects all carry theirs needs nothing here -- the orchestrator hands
      # each job its project's credential over the control stream, which is why
      # the stream has to be TLS for that to work at all.
      GITHUB_TOKEN: "${MOIRAI_GITHUB_TOKEN-}"
      # Private keys the control plane delivers land here. Under /run, which is
      # the tmpfs below: key material must not survive a restart.
      LOOP_RUNNER_KEY_DIR: /run/moirai/keys
      LOOP_RUNNER_AGENT_ARGUMENTS: "${MOIRAI_AGENT_ARGUMENTS:---model,opencode/deepseek-v4-flash-free,--auto}"
      # Deployment-wide provider keys, used by any project that has not stored
      # its own. Each has to be listed in MOIRAI_AGENT_CREDENTIAL_NAMES above
      # and declared in MOIRAI_AGENT_CREDENTIAL_REFS on the orchestrator, or the
      # packet never asks for it and the runner never accepts it.
      #
      # Compose cannot name a variable it does not know, so a provider not
      # listed here needs a line of its own in an override file.
      OPENROUTER_API_KEY: "${OPENROUTER_API_KEY-}"
      ANTHROPIC_API_KEY: "${ANTHROPIC_API_KEY-}"
    depends_on:
      orchestrator: {condition: service_healthy}
    # Clones, fetches and pushes, and the agent calls its model provider, so
    # this needs the internet. Nothing on the console network needs to reach it.
    networks: [control, egress]
    volumes: [runner-data:/data]
    read_only: true
    tmpfs:
      - /run:mode=0755
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    healthcheck:
      test: ["CMD", "/runner", "live"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 40s
    deploy:
      resources:
        limits:
          cpus: "${MOIRAI_RUNNER_CPUS:-2}"
          memory: "${MOIRAI_RUNNER_MEMORY:-4g}"

networks:
  # No route off the host. Nothing on these two needs one, and a compromised
  # service on them cannot call home.
  database: {internal: true}
  control: {internal: true}
  # Reaches the internet. Moirai acts on GitHub as you -- reading issues,
  # cloning, pushing, opening and merging pull requests -- so the two services
  # that do that have to get out.
  #
  # This is separate from `public` so that "needs the internet" and "is part of
  # the console's published surface" stay different things: the orchestrator
  # gets egress without becoming reachable from the web container.
  egress: {}
  # The console. web publishes a port to the host and proxies /api/ to api.
  public: {}

volumes:
  postgres-data: {}
  runner-data: {}
