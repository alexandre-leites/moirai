# Moirai — self-contained "local" stack.
#
# One file, no ./secrets directory, no .env required. Every value has a working
# default, so this is meant to be pasted straight into Portainer
# (Stacks -> Add stack -> Web editor) or run with:
#
#   docker compose -f compose.local.yaml up -d
#
# Nothing has to be set to bring the stack up, including the GitHub token. The
# console will run and you can sign in. Moirai cannot do any actual work
# without a token though -- it reads issues, clones, pushes and opens pull
# requests as you -- so set MOIRAI_GITHUB_TOKEN once you want it to run
# something. In Portainer that goes under "Environment variables" on the stack
# form; it needs `repo` and `workflow` scope.
#
# ---------------------------------------------------------------------------
# THIS FILE IS FOR A TRUSTED, PRIVATE HOST.
#
# The passwords below have defaults so the stack starts unattended, which means
# they are public knowledge. Only port 3000 is published, and the console is
# HTTP with a non-Secure session cookie, so anyone who can reach that port can
# reach the control plane. Do not expose it to the internet, and change
# MOIRAI_ADMIN_PASSWORD and MOIRAI_POSTGRES_PASSWORD if the host is shared.
#
# For anything beyond a private box use compose.yaml, which keeps every secret
# in a file under ./secrets and binds the API to loopback.
# ---------------------------------------------------------------------------
#
# Images are pulled from GHCR, never built -- Portainer's web editor has no build
# context, and a `build:` section here would make the stack undeployable there.
# Pin MOIRAI_IMAGE_TAG (`0.1.0`) for anything reproducible; it defaults to
# `latest`, which moves. MOIRAI_IMAGE_PREFIX points it at a fork or mirror.
#
# The repository is private, so the packages are too: the Docker host needs
# credentials for ghcr.io with `read:packages`. In Portainer that is
# Registries -> Add registry -> Custom, with `ghcr.io` as the URL.
#
# To build from this checkout instead, use compose.yaml -- it builds all four
# services and keeps its secrets in files under ./secrets/.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: loop
      POSTGRES_USER: loop
      POSTGRES_PASSWORD: "${MOIRAI_POSTGRES_PASSWORD:-moirai-local-postgres}"
    volumes: [postgres-data:/var/lib/postgresql/data]
    networks: [database]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, DAC_READ_SEARCH, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U loop -d loop"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  orchestrator:
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/orchestrator:${MOIRAI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LOOP_GRPC_BIND: 0.0.0.0:50051
      # The entrypoint writes each of these into a tmpfs file the unprivileged
      # user can read, then unsets the variable so it never reaches the server
      # process. They remain visible to `docker inspect` and in Portainer's UI,
      # which is the trade this file makes for being a single self-contained
      # stack -- compose.yaml keeps them in files under ./secrets instead.
      LOOP_DATABASE_URL: "postgresql+asyncpg://loop:${MOIRAI_POSTGRES_PASSWORD:-moirai-local-postgres}@postgres:5432/loop"
      LOOP_INITIAL_ADMIN_USERNAME: "${MOIRAI_ADMIN_USERNAME:-admin}"
      # Policy: 8+ characters with a digit, a capital, a lowercase and a symbol.
      # A password that fails it stops the orchestrator from starting, which
      # Compose surfaces only as an unhealthy container.
      LOOP_INITIAL_ADMIN_PASSWORD: "${MOIRAI_ADMIN_PASSWORD:-Moirai-Local-1}"
      RUNNER_REGISTRATION_TOKEN: "${MOIRAI_RUNNER_TOKEN:-moirai-local-runner-registration-token}"
      # Optional. Without it the stack runs and the console works, but nothing
      # can be read from or written to GitHub. `-` not `:-` so an explicit empty
      # value stays empty and is treated as "not configured".
      LOOP_GITHUB_TOKEN: "${MOIRAI_GITHUB_TOKEN-}"
      # Seed project created on a fresh database. Set MOIRAI_SEED_PROJECT_NAME
      # to an empty string to turn seeding off.
      LOOP_SEED_PROJECT_NAME: "${MOIRAI_SEED_PROJECT_NAME-demo}"
      LOOP_SEED_PROJECT_REPOSITORY_URL: "${MOIRAI_SEED_PROJECT_REPOSITORY_URL-}"
      LOOP_SEED_TOKEN_LABELS: "${MOIRAI_RUNNER_LABELS:-linux}"
    depends_on:
      postgres: {condition: service_healthy}
    networks: [database, control]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, FOWNER, SETGID, SETUID]
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import json,sys,time; d=json.load(open('/tmp/loop-orchestrator-health.json')); sys.exit(0 if d.get('db_ok') and time.time()-d.get('updated_at',0)<45 else 1)\""]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  api:
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/api:${MOIRAI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LOOP_ORCHESTRATOR_ENDPOINT: orchestrator:50051
      # The console is served over plain HTTP here, so the session cookie
      # cannot carry Secure or the browser will refuse to store it.
      LOOP_API_COOKIE_SECURE: "false"
    depends_on:
      orchestrator: {condition: service_healthy}
    networks: [control, public]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost:8080/ready || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  web:
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/web:${MOIRAI_IMAGE_TAG:-latest}
    restart: unless-stopped
    depends_on:
      api: {condition: service_healthy}
    networks: [public]
    # The only published port. nginx proxies /api/ to the api service over the
    # internal network, so the API needs no port of its own.
    ports: ["${MOIRAI_WEB_PORT:-3000}:8080"]
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/ || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 15s

  runner:
    image: ${MOIRAI_IMAGE_PREFIX:-ghcr.io/alexandre-leites/moirai}/runner:${MOIRAI_IMAGE_TAG:-latest}
    restart: unless-stopped
    environment:
      LOOP_ORCHESTRATOR_ENDPOINT: orchestrator:50051
      # Written to tmpfs and unset by the entrypoint before the runner starts,
      # so it never reaches the runner process -- let alone an agent it spawns.
      LOOP_RUNNER_REGISTRATION_TOKEN: "${MOIRAI_RUNNER_TOKEN:-moirai-local-runner-registration-token}"
      LOOP_RUNNER_NAME: "${MOIRAI_RUNNER_NAME:-runner-1}"
      LOOP_RUNNER_LABELS: "${MOIRAI_RUNNER_LABELS:-linux}"
      LOOP_RUNNER_CAPACITY: "${MOIRAI_RUNNER_CAPACITY:-1}"
      # Which task-packet environment requests the runner will honour.
      # GITHUB_TOKEN is required for managed clones and for anything that pushes.
      LOOP_RUNNER_ALLOWED_ENVIRONMENT: GITHUB_TOKEN
      GITHUB_TOKEN: "${MOIRAI_GITHUB_TOKEN-}"
      LOOP_RUNNER_AGENT_ARGUMENTS: "${MOIRAI_AGENT_ARGUMENTS:---model,opencode/deepseek-v4-flash-free,--auto}"
    depends_on:
      orchestrator: {condition: service_healthy}
    networks: [control, public]
    volumes: [runner-data:/data]
    read_only: true
    tmpfs:
      - /run:mode=0755
    security_opt: [no-new-privileges:true]
    cap_drop: [ALL]
    cap_add: [CHOWN, DAC_OVERRIDE, SETGID, SETUID]
    healthcheck:
      test: ["CMD", "/runner", "live"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "${MOIRAI_RUNNER_CPUS:-2}"
          memory: "${MOIRAI_RUNNER_MEMORY:-4g}"

networks:
  database: {internal: true}
  control: {internal: true}
  public: {}

volumes:
  postgres-data: {}
  runner-data: {}
